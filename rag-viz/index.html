<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG 全链路 · 交互式拆解</title>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">RAG</div>
          <div>
            <h1>检索增强生成 · 全链路拆解</h1>
            <p>从一句提问到带引用的回答，中间到底发生了什么</p>
          </div>
        </div>

        <div class="query-box" id="query-box">
          <span class="q-label">提问</span>
          <input
            id="query-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="输入你的问题"
            placeholder="输入问题，或从右侧预设里选一个…"
          />
          <button class="icon-btn" id="btn-presets" aria-label="选择预设问题" aria-haspopup="listbox">▾</button>
          <div class="popover" id="preset-popover" hidden role="listbox" aria-label="预设问题"></div>
        </div>

        <div class="run-controls">
          <button class="btn" id="btn-step" title="下一站（→）">
            下一站 <kbd>→</kbd>
          </button>
          <button class="btn btn-primary" id="btn-play" title="自动演示（空格）">▶ 自动演示</button>
          <button class="btn btn-ghost" id="btn-reset" title="回到第 1 站">重置</button>
          <button class="btn btn-ghost" id="btn-panorama">技术全景</button>
        </div>
      </header>

      <main class="main">
        <aside class="rail" aria-label="流程步骤">
          <div class="rail-head">流程 <b id="rail-progress">1 / 9</b></div>
          <div class="rail-groups" id="rail-groups"></div>
          <div class="rail-foot">
            <kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>空格</kbd> 播放<br />
            <kbd>1</kbd>–<kbd>9</kbd> 直达 · <kbd>Esc</kbd> 关闭弹层
          </div>
        </aside>

        <section class="stage" id="stage">
          <header class="stage-head" id="stage-head"></header>
          <div class="stage-body" id="stage-body"></div>
        </section>
      </main>

      <footer class="statusbar">
        <div class="status-log" id="status-log"></div>
        <div class="status-metrics" id="status-metrics"></div>
      </footer>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <div>
            <h2 id="modal-title">企业级 RAG 技术全景</h2>
            <p>标「可演示」的是本页可交互的部分；标「说明」的只列出概念，本页没有模拟。</p>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-ghost" id="modal-close">关闭 <kbd>Esc</kbd></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/engine.js"></script>
    <script src="assets/viz3d.js"></script>
    <script src="assets/ui-core.js"></script>
    <script src="assets/components.js"></script>
    <script src="assets/stages-a.js"></script>
    <script src="assets/stages-b.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
