c/agent.ts","line":377,"symbol":"session.append('tool/result')"}]},{"id":"l20","phase":"收束","title":"关闭 Step","node":"stepEnd","code":"agent-turn","detail":"`step/end` 在 finally 中必写：即使 Step 抛错，边界也会闭合。工具批次结算后，admission 的 toolSet 被 dispose。","input":"turn、step","output":"step/end","event":"step/end","files":[{"path":"packages/core/agent-loop/src/agent.ts","line":388,"symbol":"session.append('step/end')"}]},{"id":"l21","phase":"收束","title":"还有欠账吗？","node":"more","code":"agent-turn","detail":"两种欠账：工具结果要求继续推理（step 返回 null），或 inbox 里来了新输入。只要还有，就回到领取阶段开下一个 Step——这就是循环的回边。","input":"stepEnd 结果 + inbox 长度","output":"继续下一 Step | 进入收尾","event":"","files":[{"path":"packages/core/agent-loop/src/agent.ts","line":395,"symbol":"inbox.nextStep.length === 0"}]},{"id":"l22","phase":"收束","title":"agent/turn-stopping 与 turn/end","node":"turnStop","code":"agent-turn","detail":"确认没有欠账后跑 serial 的 `agent/turn-stopping`（监听器可以取消），然后在 finally 写 `turn/end`，带上 completed / max-tokens / error / aborted 等原因。","input":"turn、原因","output":"turn/end","event":"agent/turn-stopping · turn/end","files":[{"path":"packages/core/agent-loop/src/agent.ts","line":396,"symbol":"agent/turn-stopping"},{"path":"packages/core/agent-loop/src/agent.ts","line":422,"symbol":"turn/end"}]},{"id":"l23","phase":"异常","title":"取消与失败：也走同一条收尾路径","node":"failed","code":"agent-commit","detail":"取消把 `AbortSignal` 的 cause 复制进 `turn/end`；流失败先尝试 `agent/request-error`，监听器返回 retry 就重试同一 Step，否则以 LlmError 终止。工具失败被转成结果，插件失败则直接关闭轮次——插件失败结束的是轮次，不是循环。","input":"AbortSignal / LlmError / 插件异常","output":"turn/end { kind: 'aborted' | 'error' }","event":"agent/request-error","files":[{"path":"packages/core/agent-loop/src/agent.ts","line":405,"symbol":"aborted 分支"},{"path":"packages/core/agent-loop/src/agent.ts","line":548,"symbol":"agent/request-error"}]}],"notes":[{"title":"一次模型请求 = 一个 Step，不是一个 Turn","text":"工具调用会让模型再被请求一次；这两次请求都在同一个 Turn 里，各自是一个 Step，各自有一条 assistant/message。"},{"title":"循环不判断业务是否完成","text":"源码里只有「有没有工具调用 / 有没有新输入」这两个条件。任务完成与否由 :"Waterfall 事件","plain":"洋葱式拦截：监听器必须调用 next() 才继续，可以改写参数或结果。","analogy":"中间件。","ref":"packages/core/tools/src/events.ts:18"},{"term":"Serial 事件","plain":"顺序执行、没有 next()，任一监听器可以抛错终止。","analogy":"登机前的最后检查。","ref":"packages/core/agent/src/runtime-types.ts:417"},{"term":"Seam","plain":"可替换能力：接口 + 提供方 + 消费方。","analogy":"插座：换插头不影响电器。","ref":"docs/capability-seams.zh.md:1"},{"term":"Adapter","plain":"把某家 provider 的协议翻译成统一的 StreamChunk。","analogy":"电源转换插头。","ref":"packages/llm/llm/src/index.ts:208"},{"term":"Tool Schema","plain":"给模型看的工具名、说明与参数 JSON Schema。","analogy":"菜单上的菜名、介绍和可选配料。","ref":"packages/llm/llm/src/types.ts:517"},{"term":"Prepared Call","plain":"把一次模型调用的适配器代际与配置一起绑定，只能派发一次。","analogy":"已经盖章的登机牌，不能换航班再用。","ref":"packages/llm/llm/src/index.ts:169"},{"term":"Projection","plain":"把已提交事件折叠成客户端/服务消费的快照视图。","analogy":"从流水账实时算出的仪表盘。","ref":"packages/session/session-projection/src/index.ts:1"},{"term":"Subagent","plain":"独立 Session 上的另一个 Agent，由父 Agent 通过工具委派。","analogy":"把子任务外包给同事，拿回一份结果。","ref":"packages/subagent/subagent/src/index.ts:451"},{"term":"Job","plain":"后台任务：注册、读取输出、终止；完成可通知模型。","analogy":"洗衣机：启动后可以去干别的。","ref":"packages/jobs/jobs/src/types.ts:179"},{"term":"Sandbox","plain":"执行世界的权限边界，fs 与进程共享同一套策略。","analogy":"给执行环境画的护栏。","ref":"packages/sandbox/sandbox-policy/src/session-mode.ts:25"},{"term":"PTC","plain":"Programmatic Tool Calling：模型写代码来编排工具调用。","analogy":"与其一步步点按钮，不如写个脚本。","ref":"packages/core/tool-executor-ptc/src/types.ts:31"},{"term":"ACP","plain":"Agent Client Protocol，编辑器/自动化平台接入 Agent 的协议。","analogy":"Agent 世界的 USB-C。","ref":"packages/acp/acp/src/index.ts:361"}]},"home":{"hero":{"eyebrow":"DEEPSEEK HARNESS · SOURCE EXPLORER","title":"源码架构可视化实验室","lead":"以本地源码为准，从「用户按下回车」一路追到「回复出现在屏幕上」。每个节点都能点开看职责、调用方、被调用方与真实代码位置。","cta":[{"label":"从架构图开始","route":"architecture"},{"label":"看 Agent Loop","route":"loop"}],"meta":["版本 0.2.2-rc.1","commit fcc0ad4","2026-11-04","零外部请求"]},"lab":{"eyebrow":"SECOND MODE · 3D EXECUTION","title":"看见 Agent 真正跑起来","text":"13 /* ===== src/js/ui.js ===== */
/* ===== UI 基础：DOM、图标、检查器、代码块、存储 ===== */
(function () {
  'use strict';

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const ICONS = {
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>',
    close: '<path d="M18 6 6 18M6 6l12 12"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
    file: '<path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/>',
    link: '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
    play: '<path d="M8 5v14l11-7z"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    prev: '<path d="M15 5 8 12l7 7"/>',
    next: '<path d="m9 5 7 7-7 7"/>',
    reset: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',
    expand: '<path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    minus: '<path d="M5 12h14"/>',
    fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    check: '<path d="m4 12 5 5L20 6"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    book: '<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-3a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h4z"/>',
    code: '<path d="m8 8-5 4 5 4M16 8l5 4-5 4"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
    route: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h6a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h1"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    check2: '<path d="M9 11l3 3 8-8"/><path d="M21 12a9 9 0 1 1-9-9"/>',
  };

  function icon(name, size = 16) {
    const path = ICONS[name] || ICONS.grid;
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
  }

  /* ---------- 存储 ---------- */
  const NS = 'dsh-lab:';
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(NS + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(NS + key, JSON.stringify(value)); } catch { /* 隐私模式下忽略 */ }
    },
    del(key) { try { localStorage.removeItem(NS + key); } catch { /* ignore */ } },
  };

  /* ---------- 提示 ---------- */
  let toastTimer = 0;
  function toast(message) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  }

  async function copy(text, label) {
    try {
      await navigator.clipboard.writeText(text);
      toast(label ? `${label} 已复制` : '已复制');
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      try { document.execCommand('copy'); toast(label ? `${label} 已复制` : '已复制'); }
      catch { toast('复制失败，请手动选择'); }
      area.remove();
    }
  }

  /* ---------- 代码高亮 ---------- */
  const KEYWORDS = new Set(('const let var function class interface type extends implements import export from return await async if else for while do switch case break continue new throw try catch finally private public protected readonly static override abstract declare module namespace as satisfies never void unknown undefined null true false this super default enum get set of in instanceof typeof yield').split(' '));

  function highlightLine(line) {
    const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|([A-Za-z_$][\w$]*)|(\d+(?:\.\d+)?)/g;
    let out = '';
    let last = 0;
    let m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));
      const text = m[0];
      let cls = '';
      if (m[1]) cls = 'tok-c';
      else if (m[2]) cls = 'tok-s';
      else if (m[3]) cls = KEYWORDS.has(text) ? 'tok-k' : (/^[A-Z]/.test(text) ? 'tok-t' : '');
      else if (m[4]) cls = 'tok-n';
      out += cls ? `<span class="${cls}">${esc(text)}</span>` : esc(text);
      last = m.index + text.length;
    }
    out += esc(line.slice(last));
    return out;
  }

  function ideHref(file, line) {
    const root = ((window.LAB_DATA && window.LAB_DATA.generated && window.LAB_DATA.generated.meta.source) || '')
      .replace(/\\/g, '/').replace(/\/+$/, '');
    if (!root || !file) return '';
    return 'vscode://file/' + encodeURI(root + '/' + file) + (line ? ':' + line : '');
  }

  function codeBlock(excerpt, opts = {}) {
    if (!excerpt) return '';
    const max = opts.max || 440;
    const lines = String(excerpt.code || '').split('\n');
    const ide = ideHref(excerpt.file, excerpt.start);
    const rows = lines.map((line, i) => {
      const n = (excerpt.start || 1) + i;
      return `<div class="code__row"><span class="code__n">${n}</span><span class="code__c">${highlightLine(line) || ' '}</span></div>`;
    }).join('');
    return `<div class="code">
      <div class="code__head">
        ${icon('file', 13)}
        <span class="code__path" title="${esc(excerpt.file)}">${esc(excerpt.file)}</span>
        <span class="code__lines">${excerpt.start}–${excerpt.end}</span>
        ${ide ? `<a class="btn btn--ghost btn--sm" href="${esc(ide)}" title="在 VS Code 中打开">${icon('link', 12)}</a>` : ''}
        <button class="btn btn--ghost btn--sm" data-copy="${esc(excerpt.file + ':' + excerpt.start)}" title="复制路径:行号">${icon('copy', 12)}</button>
      </div>
      <div class="code__body" style="max-height:${max}px"><pre>${rows}</pre></div>
    </div>`;
  }

  function fileRef(file) {
    const loc = file.line ? `${file.path}:${file.line}` : file.path;
    return `<button class="file-ref" data-file="${esc(file.path)}" data-line="${file.line || ''}" title="${esc(loc)}">
      ${icon('file')}<span>${esc(file.path)}${file.line ? `<span class="file-ref__line">:${file.line}</span>` : ''}</span>
      ${file.symbol ? `<span class="file-ref__sym">${esc(file.symbol)}</span>` : ''}
    </button>`;
  }

  /* ---------- 检查器 ---------- */
  function ensureInspector() {
    return document.getElementById('inspector');
  }

  function openInspector() {
    const app = document.querySelector('.app');
    const shell = document.querySelector('.shell');
    shell.classList.add('has-inspector');
    app.classList.add('inspector-open');
    const insp = ensureInspector();
    insp.setAttribute('aria-hidden', 'false');
  }

  function closeInspector() {
    const app = document.querySelector('.app');
    const shell = document.querySelector('.shell');
    shell.classList.remove('has-inspector');
    app.classList.remove('inspector-open');
    ensureInspector().setAttribute('aria-hidden', 'true');
  }

  function inspect({ kind = 'info', title, sub, body, foot = '' }) {
    const insp = ensureInspector();
    insp.innerHTML = `<div class="inspector__head">
      <div class="inspector__main" style="flex:1;min-width:0">
        <div class="row" style="gap:6px;margin-bottom:4px">
          <span class="badge badge--mono">${esc(kind)}</span>
        </div>
        <div class="inspector__title">${title}</div>
        ${sub ? `<div class="inspector__sub">${sub}</div>` : ''}
      </div>
      <button class="icon-btn" data-close-inspector aria-label="关闭详情">${icon('close', 15)}</button>
    </div>
    <div class="inspector__body">${body}</div>`;
    openInspector();
    insp.scrollTop = 0;
    insp.querySelector('[data-close-inspector]').addEventListener('click', closeInspector);
  }

  function emptyInspector() {
    return `<div class="empty"><div class="empty__t">还没有选中任何对象</div>点击架构图节点、事件、文件或技术卡片，这里会显示职责、关系与源码位置。</div>`;
  }

  /* ---------- 杂项 ---------- */
  const fmt = (n) => new Intl.NumberFormat('zh-CN').format(n);
  const pad = (n) => String(n).padStart(2, '0');

  function debounce(fn, wait = 120) {
    let t = 0;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
  }

  function on(el, type, handler, opts) {
    if (el) el.addEventListener(type, handler, opts);
  }

  window.UI = {
    $, $$, esc, icon, store, toast, copy, codeBlock, fileRef, ideHref,
    inspect, openInspector, closeInspector, emptyInspector,
    highlightLine, fmt, pad, debounce, on,
  };
})();

/* ===== 轻量 SVG 架构图：布局、拖拽、缩放、搜索、过滤、全屏 ===== */
(function () {
  'use strict';
  const { esc, icon } = window.UI;

  const LAYER_COLORS = {
    entry: '#5aa2ff',
    boot: '#a78bfa',
    agent: '#4fc48a',
    capability: '#56c8d8',
    data: '#e3b25f',
    surface: '#e8737d',
  };
  const KIND_COLORS = {
    step: '#5aa2ff',
    event: '#a78bfa',
    decision: '#e3b25f',
    error: '#e8737d',
    entry: '#5aa2ff',
    service: '#4fc48a',
    store: '#e3b25f',
    config: '#a78bfa',
    transport: '#56c8d8',
    ui: '#e8737d',
    adapter: '#56c8d8',
    runtime: '#a78bfa',
  };

  const NODE_W = 168;
  const NODE_H = 58;
  const MAX_ROWS = 7;

  const truncate = (s, n) => (String(s || '').length > n ? String(s).slice(0, n - 1) + '…' : String(s || ''));

  function layoutLayered(nodes, layerOrder) {
    const order = layerOrder && layerOrder.length ? layerOrder : [...new Set(nodes.map(n => n.layer))];
    const byLayer = new Map(order.map(l => [l, []]));
    nodes.forEach(n => {
      if (!byLayer.has(n.layer)) byLayer.set(n.layer, []);
      byLayer.get(n.layer).push(n);
    });
    const positions = new Map();
    let x = 70;
    let maxY = 0;
    for (const layer of order) {
      const list = byLayer.get(layer) || [];
      const columns = Math.ceil(list.length / MAX_ROWS) || 1;
      list.forEach((node, i) => {
        const col = Math.floor(i / MAX_ROWS);
        const row = i % MAX_ROWS;
        const px = x + col * (NODE_W + 26);
        const py = 54 + row * (NODE_H + 26);
        positions.set(node.id, { x: px, y: py });
        maxY = Math.max(maxY, py + NODE_H);
      });
      x += columns * (NODE_W + 26) + 18;
    }
    return { positions, width: x, height: maxY + 60 };
  }

  function layoutManual(nodes) {
    const positions = new Map();
    let maxX = 0;
    let maxY = 0;
    nodes.forEach(node => {
      const pos = { x: Number(node.x) || 0, y: Number(node.y) || 0 };
      positions.set(node.id, pos);
      maxX = Math.max(maxX, pos.x + NODE_W);
      maxY = Math.max(maxY, pos.y + NODE_H);
    });
    return { positions, width: maxX + 80, height: maxY + 120 };
  }

  class GraphView {
    constructor(container, options = {}) {
      this.el = container;
      this.nodes = (options.nodes || []).map(n => ({ ...n }));
      this.edges = (options.edges || []).map((e, i) => ({ ...e, _i: i }));
      this.nodeById = new Map(this.nodes.map(n => [n.id, n]));
      this.onNode = options.onNode || (() => {});
      this.onEdge = options.onEdge || (() => {});
      this.layerOrder = options.layerOrder || [];
      this.legend = options.legend !== false;
      this.hint = options.hint || '滚轮缩放 · 拖拽平移';
      this.activeId = null;
      this.selectedId = null;
      this.hoverId = null;
      this.visible = null;
      this.search = '';
      this.tx = 0; this.ty = 0; this.scale = 1;
      this.minScale = 0.25; this.maxScale = 2.6;
      this.dragNode = null;
      this.panning = null;
      this.moved = false;
      this._build();
      this.fit();
      this._observe();
    }

    _build() {
      const layout = this.nodes.some(n => Number.isFinite(n.x))
        ? layoutManual(this.nodes)
        : layoutLayered(this.nodes, this.layerOrder);
      this.width = layout.width;
      this.height = layout.height;
      layout.positions.forEach((pos, id) => {
        const node = this.nodeById.get(id);
        if (node) { node.x = pos.x; node.y = pos.y; }
      });

      const wrap = document.createElement('div');
      wrap.className = 'graph';
      wrap.innerHTML = `
        <svg role="img" aria-label="${esc(this.el.dataset.label || '架构图')}">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b526a"/></marker>
            <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5aa2ff"/></marker>
            <marker id="arr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b25f"/></marker>
            <marker id="arr-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8737d"/></marker>
          </defs>
          <g class="viewport">
            <g class="edges"></g>
            <g class="nodes"></g>
          </g>
        </svg>
        <div class="graph__toolbar"></div>
        <div class="graph__zoom">
          <button data-zoom="-1" aria-label="缩小">${icon('minus', 14)}</button>
          <span data-zoom-label>100%</span>
          <button data-zoom="1" aria-label="放大">${icon('plus', 14)}</button>
          <button data-fit aria-label="适配画布">${icon('fit', 14)}</button>
          <button data-fs aria-label="全屏查看">${icon('expand', 14)}</button>
        </div>
        ${this.legend ? '<div class="graph__legend"></div>' : ''}
        <div class="graph__hint">${esc(this.hint)}</div>`;
      this.el.innerHTML = '';
      this.el.appendChild(wrap);
      this.wrap = wrap;
      this.svg = wrap.querySelector('svg');
      this.viewport = wrap.querySelector('.viewport');
      this.edgeLayer = wrap.querySelector('.edges');
      this.nodeLayer = wrap.querySelector('.nodes');
      this.zoomLabel = wrap.querySelector('[data-zoom-label]');
      this._renderToolbar();
      this._renderLegend();
      this._renderNodes();
      this._renderEdges();
      this._bind();
      this._applyTransform();
    }

    _renderToolbar() {
      const bar = this.wrap.querySelector('.graph__toolbar');
      bar.innerHTML = `
        <label class="searchbox">${icon('search', 13)}
          <input type="search" placeholder="搜索节点 / 方法 / 文件" aria-label="搜索节点、方法或文件">
        </label>
        <button class="chip" data-fit-view>${icon('fit', 12)} 适配</button>
        <button class="chip" data-toggle-labels>${icon('layers', 12)} 标签</button>`;
      const input = bar.querySelector('input');
      input.addEventListener('input', () => this.setSearch(input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; this.setSearch(''); input.blur(); } });
      bar.querySelector('[data-fit-view]').addEventListener('click', () => { this.clearSelection(); this.fit(); });
      bar.querySelector('[data-toggle-labels]').addEventListener('click', (e) => {
        this.wrap.classList.toggle('show-labels');
        e.currentTarget.classList.toggle('is-active');
      });
    }

    _renderLegend() {
      const legend = this.wrap.querySelector('.graph__legend');
      if (!legend) return;
      const layers = this.layerOrder.length
        ? this.layerOrder.map(id => ({ id, label: ({ entry: '入口', boot: '装配', agent: 'Agent', capability: '能力', data: '数据', surface: '界面/通信' })[id] || id }))
        : [];
      const loop = this.edges.some(e => e.kind === 'loop')
        ? `<span><i style="background:transparent;border-top:2px dashed #e3b25f"></i>回边/循环</span>`
        : '';
      legend.innerHTML = layers.map(l => `<span><i style="background:${LAYER_COLORS[l.id] || '#7b8da3'}"></i>${esc(l.label)}</span>`).join('') + loop;
    }

    _renderNodes() {
      const frag = [];
      for (const node of this.nodes) {
        const color = LAYER_COLORS[node.layer] || KIND_COLORS[node.kind] || '#7b8da3';
        const badge = node.kind === 'event' ? 'EVENT' : node.kind === 'decision' ? 'DECISION' : node.kind === 'error' ? 'ERROR' : '';
        frag.push(`<g class="g-node g-node--${esc(node.kind || 'step')}" data-id="${esc(node.id)}" transform="translate(${node.x},${node.y})" tabindex="0" role="button" aria-label="${esc(node.label)}">
          <title>${esc(node.label)}${node.sub ? ' · ' + esc(node.sub) : ''}</title>
          <rect class="g-node__box" width="${NODE_W}" height="${NODE_H}" rx="9"></rect>
          <rect class="g-node__accent" x="0" y="10" width="3.5" height="${NODE_H - 20}" rx="2" fill="${color}"></rect>
          <text class="g-node__label" x="14" y="${node.sub ? 24 : 33}">${esc(truncate(node.label, 22))}</text>
          ${node.sub ? `<text class="g-node__sub" x="14" y="40">${esc(truncate(node.sub, 26))}</text>` : ''}
          ${badge ? `<text class="g-node__badge" x="${NODE_W - 10}" y="13" text-anchor="end">${esc(truncate(badge, 9))}</text>` : ''}
        </g>`);
      }
      this.nodeLayer.innerHTML = frag.join('');
      this.nodeEls = new Map();
      this.nodeLayer.querySelectorAll('.g-node').forEach(el => {
        const id = el.getAttribute('data-id');
        this.nodeEls.set(id, el);
        el.addEventListener('pointerdown', (e) => this._nodePointerDown(e, id));
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (this.moved) return;
          this.select(id);
          this.onNode(this.nodeById.get(id));
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.select(id); this.onNode(this.nodeById.get(id)); }
        });
        el.addEventListener('mouseenter', () => this._highlight(id, true));
        el.addEventListener('mouseleave', () => this._highlight(null, true));
      });
    }

    _edgeGeometry(edge) {
      const a = this.nodeById.get(edge.from);
      const b = this.nodeById.get(edge.to);
      if (!a || !b) return null;
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      let sx; let sy; let tx; let ty; let c1x; let c1y; let c2x; let c2y;

      if (Math.abs(dx) < 40 && dy >= 0) {
        // 同列向下：短竖线
        sx = a.x + NODE_W / 2; sy = a.y + NODE_H;
        tx = b.x + NODE_W / 2; ty = b.y;
        c1x = sx; c1y = sy + 26; c2x = tx; c2y = ty - 26;
      } else if (Math.abs(dx) < 40 && dy < 0) {
        // 同列向上：从右侧绕回（少见）
        sx = a.x + NODE_W; sy = a.y + NODE_H / 2;
        tx = b.x + NODE_W; ty = b.y + NODE_H / 2;
        c1x = sx + 46; c1y = sy; c2x = tx + 46; c2y = ty;
      } else if (dx > 40) {
        // 向右：右中 → 左中
        sx = a.x + NODE_W; sy = a.y + NODE_H / 2;
        tx = b.x; ty = b.y + NODE_H / 2;
        const mid = (sx + tx) / 2;
        c1x = mid; c1y = sy; c2x = mid; c2y = ty;
      } else if (edge.kind === 'loop') {
        // 回边：从底部绕回
        sx = a.x + NODE_W / 2; sy = a.y + NODE_H;
        tx = b.x + NODE_W / 2; ty = b.y + NODE_H;
        const drop = 60 + Math.abs(dy) * 0.12;
        c1x = sx; c1y = sy + drop; c2x = tx; c2y = ty + drop;
      } else {
        // 向左：左中 → 右中（同一行的反向流动）
        sx = a.x; sy = a.y + NODE_H / 2;
        tx = b.x + NODE_W; ty = b.y + NODE_H / 2;
        const mid = (sx + tx) / 2;
        c1x = mid; c1y = sy; c2x = mid; c2y = ty;
      }
      const d = `M${sx},${sy} C${c1x},${c1y} ${c2x},${c2y} ${tx},${ty}`;
      return { d, mx: (sx + tx) / 2, my: (sy + ty) / 2, sx, sy, tx, ty };
    }

    _renderEdges() {
      const frag = [];
      for (const edge of this.edges) {
        const geo = this._edgeGeometry(edge);
        if (!geo) continue;
        const kindCls = edge.kind === 'loop' ? ' g-edge--loop' : edge.kind === 'error' ? ' g-edge--error' : edge.kind === 'event' ? ' g-edge--event' : '';
        const marker = edge.kind === 'loop' ? 'arr-w' : edge.kind === 'error' ? 'arr-e' : 'arr';
        frag.push(`<g class="g-edge${kindCls}" data-i="${edge._i}" data-from="${esc(edge.from)}" data-to="${esc(edge.to)}">
          <path d="${geo.d}" marker-end="url(#${marker})"></path>
          <path class="g-edge__hit" d="${geo.d}" stroke="transparent" stroke-width="14" fill="none"></path>
          <text class="g-edge__label" x="${geo.mx}" y="${geo.my - 5}" text-anchor="middle">${esc(truncate(edge.label || '', 30))}</text>
        </g>`);
      }
      this.edgeLayer.innerHTML = frag.join('');
      this.edgeEls = Array.from(this.edgeLayer.querySelectorAll('.g-edge'));
      this.edgeEls.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const edge = this.edges[Number(el.getAttribute('data-i'))];
          this._activateEdge(edge, el);
          this.onEdge(edge, { x: e.clientX, y: e.clientY });
        });
      });
    }

    _activateEdge(edge, el) {
      this.edgeEls.forEach(e => e.classList.remove('is-active'));
      el.classList.add('is-active');
    }

    _bind() {
      this.svg.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.g-node')) return;
        this.panning = { x: e.clientX, y: e.clientY, tx: this.tx, ty: this.ty };
        this.moved = false;
        this.wrap.classList.add('is-panning');
        this.svg.setPointerCapture(e.pointerId);
      });
      this.svg.addEventListener('pointermove', (e) => {
        if (this.dragNode) {
          const dx = (e.clientX - this.dragNode.px) / this.scale;
          const dy = (e.clientY - this.dragNode.py) / this.scale;
          if (Math.abs(dx) + Math.abs(dy) > 2) this.moved = true;
          const node = this.nodeById.get(this.dragNode.id);
          node.x = this.dragNode.nx + dx;
          node.y = this.dragNode.ny + dy;
          this._renderEdges();
          this.nodeEls.get(node.id).setAttribute('transform', `translate(${node.x},${node.y})`);
          return;
        }
        if (!this.panning) return;
        const dx = e.clientX - this.panning.x;
        const dy = e.clientY - this.panning.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) this.moved = true;
        this.tx = this.panning.tx + dx;
        this.ty = this.panning.ty + dy;
        this._applyTransform();
      });
      const end = () => {
        this.panning = null;
        this.dragNode = null;
        this.wrap.classList.remove('is-panning');
        setTimeout(() => { this.moved = false; }, 30);
      };
      this.svg.addEventListener('pointerup', end);
      this.svg.addEventListener('pointercancel', end);
      this.svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = this.svg.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        this._zoomAt(px, py, factor);
      }, { passive: false });

      this.wrap.querySelector('[data-zoom]')?.parentElement.querySelectorAll('[data-zoom]').forEach(btn => {
        btn.addEventListener('click', () => {
          const dir = Number(btn.getAttribute('data-zoom'));
          const rect = this.svg.getBoundingClientRect();
          this._zoomAt(rect.width / 2, rect.height / 2, dir > 0 ? 1.2 : 1 / 1.2);
        });
      });
      this.wrap.querySelector('[data-fit]')?.addEventListener('click', () => this.fit());
      this.wrap.querySelector('[data-fs]')?.addEventListener('click', () => {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else this.wrap.requestFullscreen?.().then(() => setTimeout(() => this.fit(), 80)).catch(() => {});
      });
    }

    _nodePointerDown(e, id) {
      if (e.button !== 0) return;
      const node = this.nodeById.get(id);
      this.dragNode = { id, px: e.clientX, py: e.clientY, nx: node.x, ny: node.y };
      this.moved = false;
      this.svg.setPointerCapture(e.pointerId);
      e.stopPropagation();
    }

    _zoomAt(px, py, factor) {
      const next = Math.min(this.maxScale, Math.max(this.minScale, this.scale * factor));
      const k = next / this.scale;
      this.tx = px - (px - this.tx) * k;
      this.ty = py - (py - this.ty) * k;
      this.scale = next;
      this._applyTransform();
    }

    _applyTransform() {
      this.viewport.setAttribute('transform', `translate(${this.tx},${this.ty}) scale(${this.scale})`);
      if (this.zoomLabel) this.zoomLabel.textContent = Math.round(this.scale * 100) + '%';
    }

    fit() {
      const rect = this.svg.getBoundingClientRect();
      if (!rect.width || !rect.height) { requestAnimationFrame(() => this.fit()); return; }
      const pad = 24;
      const scale = Math.min((rect.width - pad * 2) / this.width, (rect.height - pad * 2) / this.height, 1.1);
      this.scale = Math.max(0.22, scale);
      this.tx = (rect.width - this.width * this.scale) / 2;
      this.ty = (rect.height - this.height * this.scale) / 2;
      this._applyTransform();
    }

    centerOn(id) {
      const node = this.nodeById.get(id);
      if (!node) return;
      const rect = this.svg.getBoundingClientRect();
      this.tx = rect.width / 2 - (node.x + NODE_W / 2) * this.scale;
      this.ty = rect.height / 2 - (node.y + NODE_H / 2) * this.scale;
      this._applyTransform();
    }

    select(id) {
      this.selectedId = id;
      this.nodeEls.forEach((el, nid) => el.classList.toggle('is-selected', nid === id));
      this._highlight(id, false);
    }

    clearSelection() {
      this.selectedId = null;
      this.nodeEls.forEach(el => el.classList.remove('is-selected'));
      this._highlight(null, false);
    }

    _neighbors(id) {
      const set = new Set([id]);
      this.edges.forEach(e => {
        if (e.from === id) set.add(e.to);
        if (e.to === id) set.add(e.from);
      });
      return set;
    }

    _highlight(id, hover) {
      if (!id) {
        this.nodeEls.forEach(el => el.classList.remove('is-dim', 'is-neighbor'));
        this.edgeEls.forEach(el => el.classList.remove('is-dim', 'is-active'));
        if (this.selectedId) this._highlight(this.selectedId, false);
        return;
      }
      const near = this._neighbors(id);
      this.nodeEls.forEach((el, nid) => {
        el.classList.toggle('is-dim', !near.has(nid));
        el.classList.toggle('is-neighbor', near.has(nid) && nid !== id);
      });
      this.edgeEls.forEach(el => {
        const active = el.getAttribute('data-from') === id || el.getAttribute('data-to') === id;
        el.classList.toggle('is-active', active);
        el.classList.toggle('is-dim', !active);
      });
    }

    setActive(id) {
      this.activeId = id;
      this.nodeEls.forEach((el, nid) => el.classList.toggle('g-node--active', nid === id));
      this.nodeEls.forEach(el => el.classList.remove('is-dim'));
      this.edgeEls.forEach(el => el.classList.remove('is-dim', 'is-active'));
    }

    setSearch(query) {
      this.search = String(query || '').trim().toLowerCase();
      if (!this.search) {
        this.nodeEls.forEach(el => el.classList.remove('is-dim', 'is-hit'));
        this.edgeEls.forEach(el => el.classList.remove('is-dim'));
        if (this.selectedId) this._highlight(this.selectedId, false);
        return;
      }
      const hits = new Set();
      this.nodes.forEach(n => {
        const hay = [n.label, n.sub, n.id, n.api, n.duty, (n.files || []).map(f => f.path).join(' ')].join(' ').toLowerCase();
        if (hay.includes(this.search)) hits.add(n.id);
      });
      this.nodeEls.forEach((el, id) => {
        el.classList.toggle('is-hit', hits.has(id));
        el.classList.toggle('is-dim', !hits.has(id));
      });
      this.edgeEls.forEach(el => el.classList.add('is-dim'));
      if (hits.size === 1) this.centerOn([...hits][0]);
    }

    setVisible(predicate) {
      this.visible = predicate;
      this.nodeEls.forEach((el, id) => {
        const show = !predicate || predicate(this.nodeById.get(id));
        el.style.opacity = show ? '' : '0';
        el.style.pointerEvents = show ? '' : 'none';
      });
      this.edgeEls.forEach(el => {
        const from = this.nodeById.get(el.getAttribute('data-from'));
        const to = this.nodeById.get(el.getAttribute('data-to'));
        const show = !predicate || (predicate(from) && predicate(to));
        el.style.opacity = show ? '' : '0';
        el.style.pointerEvents = show ? '' : 'none';
      });
    }

    _observe() {
      let raf = 0;
      const ro = new ResizeObserver(() => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => this.fit());
      });
      ro.observe(this.el);
      this._ro = ro;
      document.addEventListener('fullscreenchange', () => setTimeout(() => this.fit(), 80));
    }

    destroy() {
      if (this._ro) this._ro.disconnect();
      this.el.innerHTML = '';
    }
  }

  window.GraphView = GraphView;
  window.GRAPH_LAYER_COLORS = LAYER_COLORS;
})();

</script>
  <script>
/* ===== src/js/player.js ===== */
/* ===== 流程图播放器：上一步 / 下一步 / 自动播放 / 速度 / 进度 ===== */
(function () {
  'use strict';
  const { esc, icon } = window.UI;

  class FlowPlayer {
    constructor(options) {
      this.steps = options.steps || [];
      this.graph = options.graph || null;
      this.mount = options.mount;
      this.render = options.render || (() => '');
      this.onStep = options.onStep || (() => {});
      this.index = -1;
      this.playing = false;
      this.speed = 1;
      this.timer = 0;
      this._build();
      if (this.steps.length) this.go(0);
    }

    _build() {
      const ticks = this.steps.map((s, i) => `<button class="flow__tick" data-goto="${i}" title="${esc(s.title)}" aria-label="第 ${i + 1} 步：${esc(s.title)}"></button>`).join('');
      this.mount.innerHTML = `
        <div class="flow__controls">
          <button class="btn btn--sm" data-prev title="上一步（←）">${icon('prev', 13)} 上一步</button>
          <button class="btn btn--sm btn--primary" data-play>${icon('play', 13)} 播放</button>
          <button class="btn btn--sm" data-next title="下一步（→）">下一步 ${icon('next', 13)}</button>
          <button class="btn btn--sm" data-restart title="重新播放">${icon('reset', 13)} 重播</button>
          <div class="flow__progress">${ticks}</div>
          <span class="flow__count" data-count>1 / ${this.steps.length}</span>
          <label class="speed">速度
            <select data-speed aria-label="播放速度">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
          </label>
        </div>
        <div class="flow__detail" data-detail></div>`;
      this.mount.tabIndex = 0;
      this.mount.setAttribute('aria-label', '流程播放器：方向键切换步骤，空格播放或暂停');
      this.controls = this.mount.querySelector('.flow__controls');
      this.detail = this.mount.querySelector('[data-detail]');
      this.count = this.mount.querySelector('[data-count]');
      this.ticks = Array.from(this.mount.querySelectorAll('[data-goto]'));

      this.mount.querySelector('[data-prev]').addEventListener('click', () => { this.pause(); this.prev(); });
      this.mount.querySelector('[data-next]').addEventListener('click', () => { this.pause(); this.next(); });
      this.mount.querySelector('[data-play]').addEventListener('click', () => this.toggle());
      this.mount.querySelector('[data-restart]').addEventListener('click', () => { this.pause(); this.go(0); });
      this.mount.querySelector('[data-speed]').addEventListener('change', (e) => {
        this.speed = Number(e.target.value) || 1;
        if (this.playing) { this.pause(); this.play(); }
      });
      this.ticks.forEach((btn, i) => btn.addEventListener('click', () => { this.pause(); this.go(i); }));

      this.mount.addEventListener('keydown', (e) => {
        if (e.target.closest('select, input, textarea')) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); this.pause(); this.next(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); this.pause(); this.prev(); }
        if (e.code === 'Space' && e.target === this.mount) { e.preventDefault(); this.toggle(); }
      });
    }

    go(index) {
      if (!this.steps.length) return;
      const i = Math.max(0, Math.min(this.steps.length - 1, index));
      this.index = i;
      const step = this.steps[i];
      this.detail.innerHTML = this.render(step, i);
      this.count.textContent = `${i + 1} / ${this.steps.length}`;
      this.ticks.forEach((t, ti) => {
        t.classList.toggle('is-done', ti < i);
        t.classList.toggle('is-active', ti === i);
      });
      if (this.graph && step.node) this.graph.setActive(step.node);
      if (typeof this.onStep === 'function') this.onStep(step, i);
      this.mount.querySelector('[data-prev]').disabled = i === 0;
      this.mount.querySelector('[data-next]').disabled = i === this.steps.length - 1;
      const playBtn = this.mount.querySelector('[data-play]');
      playBtn.innerHTML = this.playing ? `${icon('pause', 13)} 暂停` : `${icon('play', 13)} 播放`;
    }

    next() {
      if (this.index >= this.steps.length - 1) { this.pause(); return; }
      this.go(this.index + 1);
    }

    prev() { if (this.index > 0) this.go(this.index - 1); }

    play() {
      if (this.playing) return;
      if (this.index >= this.steps.length - 1) this.go(0);
      this.playing = true;
      const tick = () => {
        if (!this.playing) return;
        if (this.index >= this.steps.length - 1) { this.pause(); return; }
        this.go(this.index + 1);
        this.timer = setTimeout(tick, 1700 / this.speed);
      };
      this.timer = setTimeout(tick, 1700 / this.speed);
      const playBtn = this.mount.querySelector('[data-play]');
      playBtn.innerHTML = `${icon('pause', 13)} 暂停`;
    }

    pause() {
      this.playing = false;
      clearTimeout(this.timer);
      this.timer = 0;
      const playBtn = this.mount.querySelector('[data-play]');
      if (playBtn) playBtn.innerHTML = `${icon('play', 13)} 播放`;
    }

    toggle() { this.playing ? this.pause() : this.play(); }

    destroy() {
      this.pause();
      this.mount.innerHTML = '';
      if (this.graph) this.graph.setActive(null);
    }
  }

  window.FlowPlayer = FlowPlayer;
})();

/* ===== src/js/lab-engine.js ===== */
/* ===== 执行实验室：播放引擎（场景 → 步骤 → 状态） ===== */
(function () {
  'use strict';

  const DEFAULT_MS = 1900;

  function deepText(value, task) {
    if (typeof value === 'string') return value.split('{{task}}').join(task || '');
    if (Array.isArray(value)) return value.map(v => deepText(v, task));
    if (value && typeof value === 'object') {
      const out = {};
      for (const [k, v] of Object.entries(value)) out[k] = deepText(v, task);
      return out;
    }
    return value;
  }

  class LabEngine {
    constructor(data) {
      this.data = data;
      this.stations = new Map(data.stations.map(s => [s.id, s]));
      this.scenario = null;
      this.index = -1;
      this.status = 'idle'; // idle | playing | paused | done
      this.task = '';
      this.speed = 1;
      this._timer = 0;
      this._handlers = new Map();
    }

    on(type, fn) {
      if (!this._handlers.has(type)) this._handlers.set(type, new Set());
      this._handlers.get(type).add(fn);
      return () => this._handlers.get(type).delete(fn);
    }

    emit(type, payload) {
      const set = this._handlers.get(type);
      if (set) set.forEach(fn => { try { fn(payload); } catch (error) { console.error(error); } });
    }

    load(id, task) {
      const scenario = this.data.scenarios.find(s => s.id === id) || this.data.scenarios[0];
      this.clearTimer();
      this.scenario = scenario;
      this.index = -1;
      this.status = 'idle';
      this.task = task || scenario.example;
      this.emit('load', { scenario });
      this.emit('state', this.state());
      return scenario;
    }

    beats() { return this.scenario ? this.scenario.beats : []; }
    current() { return this.beats()[this.index] || null; }
    stationOf(beat) { return beat ? this.stations.get(beat.s) : null; }
    total() { return this.beats().length; }

    setTask(task) {
      this.task = task;
      this.emit('state', this.state());
    }

    setSpeed(speed) {
      const next = Number(speed) || 1;
      this.speed = Math.max(0.25, Math.min(4, next));
      this.emit('speed', this.speed);
      if (this.status === 'playing') this.schedule();
    }

    effectiveMs(beat) {
      const raw = Number(beat && beat.ms) || DEFAULT_MS;
      return Math.max(420, raw / this.speed);
    }

    start() {
      if (!this.scenario) return;
      this.clearTimer();
      this.index = -1;
      this.status = 'playing';
      this.go(0);
      this.schedule();
    }

    play() {
      if (!this.scenario) return;
      if (this.status === 'playing') return;
      if (this.status === 'done' || this.index < 0) { this.start(); return; }
      this.status = 'playing';
      this.schedule();
      this.emit('state', this.state());
    }

    pause() {
      if (this.status !== 'playing') return;
      this.clearTimer();
      this.status = 'paused';
      this.emit('state', this.state());
    }

    toggle() {
      if (this.status === 'playing') this.pause();
      else this.play();
    }

    reset() {
      this.clearTimer();
      this.index = -1;
      this.status = 'idle';
      this.emit('state', this.state());
    }

    next() {
      if (!this.scenario) return;
      this.clearTimer();
      if (this.index >= this.total() - 1) { this.status = 'done'; this.emit('state', this.state()); return; }
      this.status = 'paused';
      this.go(this.index + 1);
    }

    prev() {
      if (!this.scenario || this.index <= 0) return;
      this.clearTimer();
      this.status = 'paused';
      this.go(this.index - 1);
    }

    go(index) {
      const beats = this.beats();
      if (!beats.length) return;
      const next = Math.max(0, Math.min(beats.length - 1, index));
      this.index = next;
      this.emit('beat', { beat: beats[next], index: next, state: this.state() });
      this.emit('state', this.state());
    }

    schedule() {
      this.clearTimer();
      if (this.status !== 'playing') return;
      const beat = this.current();
      if (!beat) return;
      this._timer = setTimeout(() => {
        if (this.status !== 'playing') return;
        if (this.index >= this.total() - 1) {
          this.status = 'done';
          this.emit('state', this.state());
          return;
        }
        this.go(this.index + 1);
        this.schedule();
      }, this.effectiveMs(beat));
    }

    clearTimer() {
      if (this._timer) { clearTimeout(this._timer); this._timer = 0; }
    }

    clearTimerOnly() { this.clearTimer(); }

    state() {
      const beats = this.beats();
      const index = this.index;
      const statuses = {};
      const completed = [];
      const trail = [];
      const seen = new Set();
      for (let i = 0; i <= index; i++) {
        const id = beats[i].s;
        if (i < index && id !== beats[index].s && !seen.has(id)) { seen.add(id); completed.push(id); }
        statuses[id] = i === index
          ? ({ error: 'error', approval: 'approval', branch: 'branch' }[beats[i].status] || 'active')
          : 'done';
      }
      if (index >= 0 && statuses[beats[index].s] === 'done') statuses[beats[index].s] = 'active';
      for (let i = 0; i < index; i++) {
        if (beats[i].s !== beats[i + 1].s) trail.push([beats[i].s, beats[i + 1].s]);
      }
      return {
        scenario: this.scenario,
        index,
        status: this.status,
        total: beats.length,
        beat: index >= 0 ? beats[index] : null,
        active: index >= 0 ? beats[index].s : null,
        statuses,
        completed,
        trail,
        cycle: index >= 0 ? (beats[index].cycle || '') : '',
        task: this.task,
        speed: this.speed,
      };
    }

    resolve(value) { return deepText(value, this.task); }

    dataFor(beat) {
      if (!beat) return null;
      return deepText(beat.data !== undefined ? beat.data : this.stationOf(beat).sample, this.task);
    }

    textFor(beat) {
      if (!beat) return { title: '', detail: '', input: '', output: '' };
      const station = this.stationOf(beat);
      const io = beat.io || [station.input, station.output];
      return {
        title: deepText(beat.t, this.task),
        detail: deepText(beat.d, this.task),
        input: deepText(io[0], this.task),
        output: deepText(io[1], this.task),
      };
    }

    destroy() {
      this.clearTimer();
      this._handlers.clear();
    }
  }

  window.LabEngine = LabEngine;
})();
