livered","file":"packages/team/agent-team/src/types.ts","line":185},{"name":"todo/write","file":"packages/todo/tool-todo/src/types.ts","line":33},{"name":"web/deepseek-search-llm-request","file":"packages/web/web-search-deepseek/src/provider.ts","line":89},{"name":"tool-workflow/run-start","file":"packages/workflow/tool-workflow/src/types.ts","line":47},{"name":"tool-workflow/agent-start","file":"packages/workflow/tool-workflow/src/types.ts","line":52},{"name":"tool-workflow/agent-end","file":"packages/workflow/tool-workflow/src/types.ts","line":57},{"name":"tool-workflow/run-end","file":"packages/workflow/tool-workflow/src/types.ts","line":62}],"excerpts":[{"id":"cli-entry","file":"apps/cli/src/bin.ts","start":26,"end":48,"label":"CLI 入口 · runCli()","note":"解析参数后按 invocation.mode 分派：profile 模式动态载入 profile-boot 并调用 runProfile()。","code":"export async function runCli(options: RunCliOptions = {}): Promise<void> {\n  const version = getDshRuntimeVersion()\n  const { manageDesktopProfile, ...profileOptions } = options\n  const invocation = parseDshArgs(process.argv.slice(2), version, manageDesktopProfile)\n\n  switch (invocation.mode) {\n    case 'profile': {\n      const { runProfile } = await import('./profile-boot.ts')\n      try {\n        await runProfile({\n          environment: loadLayeredEnv('dsh'),\n          profile: invocation.profile,\n          fromDefaultProfile: invocation.fromDefaultProfile,\n          patchFiles: invocation.patches,\n          args: invocation.args,\n          ...profileOptions,\n        })\n      } catch (error) {\n        if (!(error instanceof StartupError)) throw error\n        await reportStartupFailure(error, { home: resolveDshHome(), version, profile: invocation.profile })\n        process.exit(1)\n      }\n      break","hash":"cf889f2717e6"},{"id":"profile-boot","file":"apps/cli/src/profile-boot.ts","start":292,"end":346,"label":"runProfile · 组合 profile 并启动","note":"composeProfile() 解析 bundle/patch 层，boot() 挂载 Cordis 树，appReady 只在 loader 就绪后提交。","code":"    const composed = await composeProfile(\n      options.profile, options.patchFiles, options.fromDefaultProfile, options.resolvedProfile,\n    )\n    const appReady = createAppReady()\n    const shutdown = createProcessShutdown(dispose)\n    const signalShutdown = new AbortController()\n    const interrupt = (code: number): void => {\n      signalShutdown.abort()\n      shutdown.interrupt(code)\n    }\n    // Signals own teardown throughout the startup window, not only after boot()\n    // settles: an inserted provider can publish before sibling rows finish mounting.\n    // SIGTERM is a supervisor's ordinary stop request and exits 0 on every\n    // surface — the launcher does not know whether the app considered its work\n    // complete; SIGINT is a user interrupt and reports 130.\n    process.on('SIGTERM', () => { interrupt(0) })\n    process.on('SIGINT', () => { interrupt(130) })\n    installFailLoud(NAME, process, async () => {\n      await app.current?.fiber.dispose()\n    })\n\n    const rootConfig = join(composed.profile.dir, PROFILE_ROOT_FILENAME)\n    const profileContext: ProfileContext = {\n      name: options.profile,\n      ...(options.packageManager === undefined ? {} : { packageManager: options.packageManager }),\n      dir: composed.profile.dir, patchPath: composed.profile.patchPath,\n      installAnchor: options.resolvedProfile?.installAnchor ?? INSTALL_ANCHOR,\n      startedBundles: composed.profile.layers.map(layer => layer.packageName),\n      cwd: process.cwd(), home: resolveDshHome(),\n      overlays: composed.overlays, telemetryDisabledEnv: process.env.DSH_TELEMETRY_DISABLED,\n    }\n    const ctx = await boot(NAME, rootConfig, readProfilePatches(NAME, profileContext, composed.profile), async (hostCtx) => {\n      app.current = hostCtx\n      hostCtx.provide('profileContext', profileContext)\n      // Before any config-tree entry mounts, so plugins resolve all launch-time\n      // environment values from the same immutable launch snapshot.\n      hostCtx.provide(DSH_LAUNCH_ENVIRONMENT_KEY, options.environment)\n      await hostCtx.plugin(PluginPackages, {\n        resolution: composed.resolution,\n      })\n      // The command line and bounded exit request are launcher facts available\n      // to every app plugin that injects the argument snapshot.\n      provideCmdline(hostCtx, {\n        args: options.args,\n        exit: code => void shutdown.shutdown(code),\n        ready: appReady.service,\n      })\n    })\n    app.current = ctx\n    if (!signalShutdown.signal.aborted\n      && ctx.fiber.state === FiberState.ACTIVE\n      && ctx.get('loader') !== undefined) {\n      appReady.commit()\n    }\n    return { ctx, shutdown }","hash":"0d299754fd42"},{"id":"app-boot","file":"packages/boot/app-boot/src/index.ts","start":1200,"end":1236,"label":"boot() · Loader 与根 include","note":"Cordis 上下文创建后先挂 Loader，再把 profile 根配置与 patch 层挂成一条 include 条目。","code":"export async function boot(\n  binName: string,\n  absoluteConfigPath: string,\n  patches?: PatchOptions[],\n  prepare?: (ctx: Context) => Promise<void> | void,\n  bareModuleBaseUrl?: string,\n): Promise<Context> {\n  const ctx = new Context()\n  const startupLogs: StartupLogRecord[] = []\n  // The collector must outlive root disposal to retain asynchronous cleanup errors.\n  const diagnostics = new Context()\n  diagnostics.logger = ctx.logger\n  diagnostics.logger.exporter({\n    levels: { default: 2 },\n    export: ({ ts, name, type, args }) => {\n      if (type === 'warn' || type === 'error') startupLogs.push({ ts, name, type, args })\n    },\n  })\n  // Two failure labels: `prepare` runs before any config-tree entry mounts,\n  // so its failure is host setup, not the plugin tree.\n  let stage = 'host preparation failed'\n  try {\n    ctx.baseUrl = pathToFileURL(dirname(absoluteConfigPath)).href + '/'\n    ctx.provide('dshHomePath', dshHomePath)\n    await ctx.plugin(Loader)\n    await prepare?.(ctx)\n    stage = 'plugin tree failed to load'\n    await mountRootInclude(ctx, absoluteConfigPath, patches, bareModuleBaseUrl, binName)\n    // A surface can finish and dispose the whole tree while startup is still\n    // in flight, before the last entry settles. The Loader service goes with\n    // it, and the activation audit describes a live tree — reading `ctx.loader`\n    // past this point would throw a TypeError over an app that exited exactly\n    // as asked. Re-check after settlement before auditing the tree.\n    await ctx.get('loader')?.await()\n    if (ctx.get('loader') === undefined) return ctx\n    await auditStartupEntries(ctx, binName)\n    return ctx","hash":"e71a0a5a6d53"},{"id":"agent-send","file":"packages/core/agent-loop/src/agent.ts","start":170,"end":197,"label":"Agent.send / followup / steer / inject","note":"四种入口都落到 inbox.splice；followup 唤醒新轮次，steer 进 next-step，inject 不唤醒。","code":"  send(message: UserMessage, target: InboxTarget, wakeup: boolean): void {\n    // Waking input cannot join an aborted activity, so it starts the next turn.\n    // Captured before the insertion so a reentrant cancel from a splice observer cannot reclassify it.\n    const wakingAfterAbort = wakeup && this.phase.kind !== 'idle' && this.phase.abort.signal.aborted\n    const resolvedTarget = wakingAfterAbort ? 'next-turn' : target\n    this.inbox.splice(resolvedTarget, Infinity, 0, [message])\n    if (wakeup) this.wakeDriver(wakingAfterAbort)\n  }\n\n  followup(input: UserMessage): void {\n    this.send(input, 'next-turn', true)\n  }\n\n  steer(input: UserMessage): void {\n    this.send(input, 'next-step', true)\n  }\n\n  inject(input: UserMessage): void {\n    this.send(input, 'next-step', false)\n  }\n\n  cancel(cause: AgentCancelCause, options: CancelOptions = {}): void {\n    if (!options.keepInbox) {\n      this.inbox.clear()\n      if (this.phase.kind !== 'idle') this.phase.wakeRequested = false\n    }\n    if (this.phase.kind !== 'idle') this.phase.abort.abort(cause)\n  }","hash":"df3141861511"},{"id":"agent-wake","file":"packages/core/agent-loop/src/agent.ts","start":230,"end":281,"label":"wakeDriver() / kick()","note":"空闲时立即启动驱动器；忙碌时把唤醒闩到当前活动收敛，kick() 循环调用 turn()。","code":"  private wakeDriver(wakeAfterAbort = false): void {\n    if (this.phase.kind !== 'idle') {\n      // Maintenance and aborted drivers cannot deliver the wake: latch it for\n      // replay at convergence. Live drivers claim queued work themselves;\n      // disposal never latches, so teardown waits on no model turn.\n      const reason = abortedCancelCause(this.phase.abort.signal)\n      if (reason?.kind !== 'disposed' && (this.phase.kind === 'maintenance' || wakeAfterAbort)) {\n        this.phase.wakeRequested = true\n      }\n      return\n    }\n    const driver = Promise.withResolvers<void>()\n    this.activityDone = driver.promise\n    this.setPhase({\n      kind: 'running',\n      abort: new AbortController(),\n      turn: this.phase.lastTurn,\n      step: 0,\n      wakeRequested: false,\n    })\n    this.loopCtx.agents.withInitiator(this, () => this.kick()).then(driver.resolve, driver.reject)\n  }\n\n  async whenIdle(): Promise<void> {\n    let activity: Promise<void>\n    do {\n      await (activity = this.activityDone)\n    } while (activity !== this.activityDone)\n  }\n\n  /** Report one failure at its live boundary, then preserve it for driver containment. */\n  private throwError(error: unknown): never {\n    const turn = this.phase.kind === 'running' ? this.phase.turn : this.phase.lastTurn\n    const step = this.phase.kind === 'running' ? this.phase.step : 0\n    this.dispatch.emit('agent/error', { turn, step, error })\n    throw error\n  }\n\n  private async kick(): Promise<void> {\n    try {\n      while (await this.turn()) {}\n    } catch (_error) {\n      // Reported failures and cancellation are contained at the driver boundary.\n    } finally {\n      /* v8 ignore next -- kick owns a running phase until this driver boundary */\n      if (this.phase.kind === 'running') {\n        const { turn, wakeRequested } = this.phase\n        this.setPhase({ kind: 'idle', lastTurn: turn })\n        if (wakeRequested && this.inbox.hasPending) this.wakeDriver()\n      }\n    }\n  }","hash":"40a3784cbdef"},{"id":"agent-turn","file":"packages/core/agent-loop/src/agent.ts","start":326,"end":433,"label":"turn() · 轮次循环","note":"turn/start 后循环 preStep → step/start → step() → step/end，工具欠账或新输入则进入下一 Step，最后 turn/end。","code":"  /** Open one turn before claiming its first proposed step. */\n  private async turn(): Promise<boolean> {\n    if (this.phase.kind !== 'running') {\n      this.throwError(new Error(`agent \"${this.id}\": turn without driver reservation`))\n    }\n    const phase = this.phase\n    const { signal } = phase.abort\n    signal.throwIfAborted()\n    const turn = phase.turn + 1\n    try {\n      this.session.append('turn/start', { turn })\n    } catch (error: unknown) {\n      this.throwError(error)\n    }\n    phase.turn = turn\n    let turnEnds: TurnEndReason | null = null\n    let target: InboxTarget = 'next-turn'\n    try {\n      while (true) {\n        signal.throwIfAborted()\n        const step = phase.step + 1\n        const decision = await this.preStep(target, { turn, step })\n        if (decision.kind === 'reject') {\n          turnEnds = { kind: 'blocked' }\n          return false\n        }\n        try {\n          if (turnEnds && decision.messages.length === 0) break\n          // A removed waking message or an enter decision rewritten to empty\n          // still owns the initial turn boundary, but it spends no model call.\n          if (phase.step === 0 && decision.messages.length === 0) {\n            turnEnds = { kind: 'completed' }\n            return false\n          }\n          signal.throwIfAborted()\n          this.session.append('step/start', { turn, step })\n          phase.step = step\n          const toolRecovery = new ToolCallRecovery()\n          const stopRecovery = this.ctx.on('session/event', (session, event) => {\n            if (session === this.session) toolRecovery.observe(event)\n          })\n          try {\n            // max-tokens is sticky: once any step hits the ceiling, later steps\n            // that complete normally must not downgrade the turn outcome.\n            const stepEnd = await this.step(decision)\n            // max-tokens stays sticky: a later completed step must not\n            // downgrade the turn outcome.\n            if (turnEnds === null || turnEnds.kind !== 'max-tokens') turnEnds = stepEnd\n          } catch (error: unknown) {\n            try {\n              for (const event of toolRecovery.results()) {\n                this.session.append('tool/result', event.data, {\n                  surfaceOp: 'append',\n                  ...event.sourceEventSeqs === undefined ? {} : { sourceEventSeqs: event.sourceEventSeqs },\n                })\n              }\n            } catch (recoveryError: unknown) {\n              throw new AggregateError([error, recoveryError], 'Step failed and its pending tool results could not be recorded', { cause: error })\n            }\n            throw error\n          } finally {\n            stopRecovery()\n            this.session.append('step/end', { turn, step })\n          }\n        } finally {\n          // Admission closes once the step's tool batch settles or no step opens.\n          decision.toolSet.dispose()\n        }\n        signal.throwIfAborted()\n        if (turnEnds && this.inbox.nextStep.length === 0) {\n          await this.dispatch.serial('agent/turn-stopping', { turn, signal })\n          signal.throwIfAborted()\n        }\n        if (turnEnds && this.inbox.nextStep.length === 0) break\n        target = 'next-step'\n      }\n    } catch (error: unknown) {\n      // A cause is present exactly while the signal is aborted.\n      const cause = abortedCancelCause(signal)\n      if (cause !== undefined) {\n        turnEnds = { kind: 'aborted', reason: cause }\n        throw error\n      }\n      // Every failure is structured: an `LlmError` keeps its facts, a tool\n      // activation failure keeps its code, and anything else flattens to\n      // `errorChain` text under the `UNKNOWN` code.\n      turnEnds = {\n        kind: 'error',\n        error: error instanceof LlmError\n          ? error.failure\n          : { message: errorChain(error), code: error instanceof ToolActivationError ? error.code : 'UNKNOWN' },\n      }\n      this.throwError(error)\n    } finally {\n      try {\n        // oxlint-disable-next-line typescript/no-non-null-assertion -- every exit assigns a turn ending\n        this.session.append('turn/end', { turn, reason: turnEnds! })\n      } catch (error: unknown) {\n        this.throwError(error)\n      }\n    }\n    if (!this.inbox.hasPending) return false\n    phase.abort = new AbortController()\n    // A fresh controller makes a latch set on the old one stale: the live driver claims the queue itself.\n    phase.wakeRequested = false\n    phase.step = 0\n    return true\n  }","hash":"354e8c56182d"},{"id":"agent-step","file":"packages/core/agent-loop/src/agent.ts","start":435,"end":500,"label":"step() · 准备请求并发起流式调用","note":"prepareRequest() 绑定适配器后协调 system/message、写入 user/message，再 buildRequest() 并消费 stream。","code":"  private async step(decision: Extract<PreparedStep, { kind: 'enter' }>): Promise<StepEndReason | null> {\n    /* v8 ignore next -- private callers establish the running phase before executing a step */\n    if (this.phase.kind !== 'running') throw new Error(`agent \"${this.id}\": step outside running phase`)\n    const { turn, step, abort: { signal } } = this.phase\n    signal.throwIfAborted()\n\n    const { assembly } = decision\n    const renderedPrompt = renderPrompt(assembly)\n    let firstAttempt = true\n    while (true) {\n      const { config, preparedCall } = await this.prepareRequest(turn, step, decision.selection, signal)\n      const currentContext = this.loopCtx.systemPrompt.refreshContext(assembly, {\n        ...assembleContextFor(this, signal), modelSelection: decision.selection,\n      })\n      const sections = renderContextSections(currentContext)\n      const context = this.runtimeContext.project(joinContextSections(sections), sections)\n      signal.throwIfAborted()\n      const startsRequestSeries = firstAttempt && decision.startsRequestSeries === true\n      const commits = this.systemPrompt.project(renderedPrompt, {\n        inHistory: preparedCall?.systemPromptUpdate === 'in-history',\n        startsSeries: startsRequestSeries\n          || this.requestSurfaceGeneration !== this.session.surface.contentGeneration\n          || (preparedCall?.toolUpdate === undefined && this.toolsChanged(assembly.tools)),\n      })\n      for (const { message, intent } of commits) {\n        this.session.append('system/message', { turn, step, message }, intent)\n      }\n      let contextAdmitted = false\n      if (firstAttempt) {\n        for (const message of decision.messages) {\n          if (message.source.kind === 'runtime-context') {\n            if (context !== undefined && !contextAdmitted) {\n              this.session.append('user/message', context, { surfaceOp: 'append' })\n              contextAdmitted = true\n            }\n          } else {\n            this.session.append('user/message', message, { surfaceOp: 'append' })\n          }\n        }\n      }\n      if (context !== undefined && !contextAdmitted) {\n        this.session.append('user/message', context, { surfaceOp: 'append' })\n      }\n      firstAttempt = false\n      const request = this.buildRequest(config, preparedCall, assembly.tools, { turn, step }, startsRequestSeries, signal)\n      const live = new AssistantStreamAttempt(\n        this.session.id,\n        ++this.assistantAttemptCounter,\n        () => ++this.assistantStreamRevision,\n        turn,\n        step,\n        (frame) => { this.dispatch.emit('agent/assistant-stream', { frame }) },\n      )\n      let started = false\n      try {\n        const stream = preparedCall?.stream(request) ?? this.loopCtx.llm.stream(request)\n        signal.throwIfAborted()\n        live.start()\n        started = true\n        for await (const chunk of stream) {\n          signal.throwIfAborted()\n          live.push(chunk)\n        }\n        signal.throwIfAborted()\n      } catch (error: unknown) {\n        if (!started) throw error","hash":"375dbb8b4059"},{"id":"agent-commit","file":"packages/core/agent-loop/src/agent.ts","start":541,"end":609,"label":"流结束 · assistant/message 与工具执行","note":"成功流先结算 assistant/message；含 tool-call 时调用 ctx.tools.execute()，结果上下文回填 next-step。","code":"      try {\n        const finish = live.finish\n        if (finish.kind === 'error' || finish.kind === 'aborted') {\n          live.settle(\n            'assistant/attempt',\n            () => this.session.append('assistant/attempt', { turn, step, stream: live.stream }).seq,\n          )\n          const action = await this.dispatch.waterfall(\n            'agent/request-error', {\n              turn,\n              step,\n              provider: request.provider,\n              failure: finish.failure,\n              retryPolicy: preparedCall?.retryPolicy,\n              signal,\n            },\n            () => Promise.resolve<RequestErrorAction>(undefined),\n          )\n          signal.throwIfAborted()\n          if (action?.kind !== 'retry') {\n            throw new LlmError(finish.failure.message, finish.failure.code, finish.failure)\n          }\n          continue\n        }\n\n        const message = createAssistantMessage({\n          content: live.blocks(),\n          source: {\n            provider: request.provider,\n            model: request.model,\n            ...live.replayState !== undefined ? { replayState: live.replayState } : {},\n          },\n        })\n        live.settle(\n          'assistant/message',\n          () => this.session.append('assistant/message', {\n            turn,\n            step,\n            message,\n            ...live.usage === undefined ? {} : { usage: live.usage },\n            stream: live.stream,\n          }, { surfaceOp: 'append' }).seq,\n        )\n        if (finish.kind === 'max-tokens') return { kind: 'max-tokens' }\n\n        const toolCalls = message.content.filter(block => block.type === 'tool-call')\n        if (toolCalls.length === 0) return { kind: 'completed' }\n        const maxParallelToolCalls = this.loopCtx.agentLoop.config.maxParallelToolCalls.get()\n        try {\n          const result = await this.loopCtx.tools.execute({\n            calls: toolCalls, signal, agent: this, log: { turn, step },\n            maxParallelToolCalls, toolSet: decision.toolSet,\n          })\n          for (const context of result.additionalContexts) {\n            this.inbox.splice('next-step', this.inbox.nextStep.length, 0, [context])\n          }\n          return result.concluded ? { kind: 'completed' } : null\n        } catch (error: unknown) {\n          if (!(error instanceof ToolBatchExecutionError)) throw error\n          for (const context of error.partial.additionalContexts) {\n            this.inbox.splice('next-step', this.inbox.nextStep.length, 0, [context])\n          }\n          throw error.cause\n        }\n      } catch (error: unknown) {\n        if (!live.ended) live.abandon()\n        throw error\n      }\n    }","hash":"e1c2a51b24ac"},{"id":"agent-prepare","file":"packages/core/agent-loop/src/agent.ts","start":613,"end":653,"label":"prepareRequest() · agent/request 与 prepareCall","note":"waterfall 允许监听器改采样等控制参数，但不许改 provider/model；随后 ctx.llm.prepareCall() 绑定适配器。","code":"  private async prepareRequest(\n    turn: number,\n    step: number,\n    selection: Readonly<ModelSelection>,\n    signal: AbortSignal,\n  ): Promise<{ config: LlmCallConfig; preparedCall?: PreparedLlmCall }> {\n    const { session } = this\n\n    // A loop instance seeds output controls from its options until it logs its\n    // own header; later steps re-resolve marked defaults.\n    const maxTokens = this.options.maxTokens\n    const persisted: Partial<LlmCallConfig> = this.requestHeaderLogged\n      // oxlint-disable-next-line typescript/no-non-null-assertion -- the instance logged the header it now folds\n      ? requestProposal(session.requestHeader()!)\n      : maxTokens === undefined ? {} : { maxTokens }\n    const { provider: _provider, model: _model, reasoningEffort: _effort, ...controls } = persisted\n    const seedConfig = deepFreeze(structuredClone({ ...controls, ...selection }))\n    const proposedConfig = await this.dispatch.waterfall(\n      'agent/request', { turn, step, signal },\n      () => Promise.resolve(seedConfig),\n    )\n    signal.throwIfAborted()\n    if (proposedConfig.provider !== selection.provider || proposedConfig.model !== selection.model) {\n      throw new Error(`agent \"${this.id}\": agent/request proposed \"${proposedConfig.provider}/${proposedConfig.model}\" after step preparation fixed \"${selection.provider}/${selection.model}\"; use agent.model.select() before step preparation`)\n    }\n    if (proposedConfig.reasoningEffort !== selection.reasoningEffort) {\n      throw new Error(`agent \"${this.id}\": agent/request proposed reasoning effort \"${proposedConfig.reasoningEffort ?? 'adapter default'}\" after step preparation fixed \"${selection.reasoningEffort ?? 'adapter default'}\"; use agent.model.select() before step preparation`)\n    }\n    let config: LlmCallConfig\n    let preparedCall: PreparedLlmCall | undefined\n    try {\n      preparedCall = await this.loopCtx.llm.prepareCall(proposedConfig, signal)\n      config = preparedCall.config\n    } catch (error: unknown) {\n      // Middleware may serve an unregistered route; terminal dispatch still requires an adapter.\n      if (!(error instanceof LlmError) || error.code !== 'NO_ADAPTER') throw error\n      config = proposedConfig\n    }\n    signal.throwIfAborted()\n    return { config, ...preparedCall === undefined ? {} : { preparedCall } }\n  }","hash":"538445d6e0a5"},{"id":"agent-build","file":"packages/core/agent-loop/src/agent.ts","start":656,"end":709,"label":"buildRequest() · header / context / messages","note":"记录 request/header 与 request/context，消息来自 session.deriveMessages()，工具来自组装结果的 header.tools。","code":"  private buildRequest(\n    config: LlmCallConfig,\n    preparedCall: PreparedLlmCall | undefined,\n    tools: GenerateOptions['tools'] & object,\n    position: { turn: number; step: number },\n    startsRequestSeries: boolean,\n    signal: AbortSignal,\n  ): GenerateOptions {\n    const { session } = this\n    const surfaceGeneration = session.surface.contentGeneration\n    const header = canonicalHeader({\n      config,\n      ...preparedCall === undefined ? {} : { adapterDefaults: preparedCall.adapterDefaults },\n      ...tools.length > 0 ? { tools } : {},\n    })\n    const baseline = this.session.requestHeader()\n    const startsSeries = startsRequestSeries\n      || this.requestSurfaceGeneration !== surfaceGeneration\n    let headerSeq: SessionSeq | undefined\n    if (!this.requestHeaderLogged) {\n      // Compaction during the first resumed pre-step must still mark a new series.\n      headerSeq = this.session.append('request/header', {\n        header,\n        reason: baseline === undefined ? 'initial' : 'resume',\n        ...startsSeries ? { startsSeries: true } : {},\n      }).seq\n      this.requestHeaderLogged = true\n    } else if (baseline === undefined || !headerEquals(baseline, header)) {\n      headerSeq = this.session.append('request/header', {\n        header,\n        reason: 'change',\n        ...startsSeries ? { startsSeries: true } : {},\n      }).seq\n    } else if (startsSeries) {\n      this.session.append('request/header', { header, reason: 'series' })\n    }\n    if (baseline !== undefined && headerSeq !== undefined) {\n      const previousNames = new Set(baseline.tools?.map(tool => tool.name))\n      const currentNames = new Set(tools.map(tool => tool.name))\n      const additions = tools.filter(tool => !previousNames.has(tool.name))\n        .map(tool => ({ type: 'tool-addition' as const, toolName: tool.name }))\n      const removals = (baseline.tools ?? []).filter(tool => !currentNames.has(tool.name))\n        .map(tool => ({ type: 'tool-removal' as const, toolName: tool.name }))\n      if (additions.length > 0 || removals.length > 0) {\n        session.append('developer/message', {\n          ...position,\n          message: createDeveloperMessage({ source: { kind: 'tool-registry' }, content: [...additions, ...removals] }),\n          ...additions.length > 0 ? { headerSeq } : {},\n        }, { surfaceOp: 'append' })\n      }\n    }\n    this.requestSurfaceGeneration = surfaceGeneration\n\n    const contextWindow = preparedCall?.context?.contextWindow","hash":"1f12fc12bac9"},{"id":"session-append","file":"packages/core/session/src/index.ts","start":806,"end":837,"label":"Session.append() · 快照、校验、追加","note":"append 先做 JSON 快照与结构校验，再生成 seq/time 并交给 commit；日志是唯一事实来源。","code":"  append<T extends SessionEventType>(\n    type: T,\n    data: SessionEventMap[T],\n    ...opts: T extends SurfaceEventType ? [opts: SurfaceIntent<T>] : []\n  ): SessionEvent<T> {\n    this.publicationEntry()\n    const surfaceOpts: SurfaceIntent | undefined = opts[0]\n    const surfaceMetadata = {\n      ...surfaceOpts?.sourceEventSeqs === undefined ? {} : { sourceEventSeqs: surfaceOpts.sourceEventSeqs },\n      ...surfaceOpts?.surfaceOp === undefined ? {} : { surfaceOp: surfaceOpts.surfaceOp },\n    }\n    const dataSnapshot = snapshotJsonValue(data)\n    if (dataSnapshot === undefined) {\n      throw new Error(`session event \"${type}\" carries non-JSON-serializable data`)\n    }\n    const surfaceMetadataSnapshot = snapshotJsonValue(surfaceMetadata)\n    if (surfaceMetadataSnapshot === undefined) {\n      throw new Error(`session event \"${type}\" carries non-JSON-serializable surface metadata`)\n    }\n    // Payload getters can detach the Session while the snapshots are read.\n    const entry = this.publicationEntry()\n    const event = deepFreeze({\n      type,\n      seq: SessionSeq(this.log.length),\n      time: Date.now(),\n      data: dataSnapshot,\n      ...(surfaceMetadataSnapshot as { surfaceOp?: unknown; sourceEventSeqs?: unknown }),\n    } as unknown as SessionEvent<T>)\n    validateSessionEventData(event, `session event \"${type}\" at seq ${event.seq}`)\n    this.commit(event as SessionEvent, entry)\n    return event\n  }","hash":"a438fa2847e6"},{"id":"session-commit","file":"packages/core/session/src/index.ts","start":886,"end":912,"label":"commit() · 写日志并广播 session/event","note":"推入 log 后同步通知 session/event 监听者；每个监听器各自隔离失败。","code":"  /**\n   * Accept one frozen candidate at the next sequence number, enter it into the\n   * log, and notify `session/event` observers with per-listener containment.\n   * @param event - the candidate built at the current log length.\n   * @param entry - the attachment read before the candidate was built.\n   */\n  private commit(event: SessionEvent, entry: SessionEntry | undefined): void {\n    this.surfaceManager.validateNext(event)\n\n    if (entry !== undefined) entry.appending = true\n    try {\n      const callbackArgs: unknown[] = [this, event]\n      const callbacks = entry === undefined\n        ? undefined\n        : collectSessionCallbacks(entry.emitCtx, [entry.carrier, 'session/event', ...callbackArgs])\n      this.log.push(event)\n      this.eventsSnapshot = undefined\n      if (entry !== undefined && callbacks !== undefined) {\n        invokeContainedSessionObservers(entry.emitCtx, 'session/event', entry.id, callbackArgs, callbacks)\n      }\n    } finally {\n      if (entry !== undefined) {\n        entry.appending = false\n        if (entry.detachRequested && entry.announcement !== 'dispatching') entry.detach()\n      }\n    }\n  }","hash":"69c3ab6ef757"},{"id":"session-derive","file":"packages/core/session/src/index.ts","start":999,"end":1020,"label":"deriveMessages() · 从事件日志投影模型历史","note":"只遍历 surface 节点增量投影，返回冻结的消息数组；模型看到的正是日志能重建的内容。","code":"  deriveMessages(): Message[] {\n    const surface = this.surface\n    const nodes = surface.nodes\n    const generation = surface.contentGeneration\n    if (generation !== this.derivedGeneration) {\n      this.derived = []\n      this.derivedNodes = 0\n      this.derivedGeneration = generation\n    }\n    for (const seq of nodes.slice(this.derivedNodes)) {\n      // Surface sequences are built from this.log — seq is always a valid\n      // index by construction. The non-null assertion expresses that invariant.\n      // oxlint-disable-next-line typescript/no-non-null-assertion\n      const msg = this.deriveEventMessage(this.log[seq]!)\n      // A surface node is one of the five message-producing types, but an\n      // empty-content assistant/message (a max-tokens step that hosts only\n      // usage) derives to null and must not enter the transcript.\n      if (msg) this.derived.push(msg)\n    }\n    this.derivedNodes = nodes.length\n    return [...this.derived]\n  }","hash":"15f686b9f275"},{"id":"session-events","file":"packages/core/session/src/types.ts","start":287,"end":410,"label":"SessionEventMap · 持久事件词汇","note":"turn/step/message/tool/request 等持久事实的形态定义；每个事件都是无损 JSON。","code":"export interface SessionEventMap {\n  /**\n   * Opens turn `turn` before the loop claims queued input or runs pre-step.\n   * Rejection, empty input, cancellation, or failure may close it with no\n   * step; otherwise the following identified `user/message` event or batch\n   * records the messages entering the step.\n   */\n  'turn/start': { turn: number }\n  /**\n   * Closes turn `turn` with the {@link TurnEndReason} that ended it. A turn\n   * with no entered step has no `step/start` or `step/end`. The loop does not await a\n   * flush at turn boundaries: `dsh-session-checkpoint-policy` owns the\n   * per-request durability checkpoint, and consumers that read storage after\n   * `whenIdle()` flush themselves. Success commits the turn; rejection is\n   * reported live and does not prevent later work.\n   */\n  'turn/end': { turn: number; reason: TurnEndReason }\n  /** Opens step `step` of turn `turn` — one model call plus the tool executions it requested. */\n  'step/start': { turn: number; step: number }\n  /** Closes step `step` of turn `turn`. */\n  'step/end': { turn: number; step: number }\n  /**\n   * A user-role message on the model-visible surface: a direct human prompt\n   * (the queued message claimed for this turn), a synthetic `agent.inject()`\n   * context (file-change notices, subdir AGENTS.md, skill content, cron\n   * notifications, …), or an entered goal continuation round. All three\n   * project their `content` verbatim; `source` tells them apart.\n   */\n  'user/message': UserMessage\n  /** An incremental agent session change admitted at the named turn and step. */\n  'developer/message': {\n    turn: number\n    step: number\n    message: DeveloperMessage\n    /** Earlier request/header defining every tool addition; required exactly when additions are present. */\n    headerSeq?: SessionSeq\n  }\n  /**\n   * The rendered system prompt on the model-visible surface. The loop appends\n   * the first one as surface node 0 before the step's first `user/message`.\n   * A prepared in-history route can append nonempty changes in a continuing\n   * series. An incapable route, or a new series whose effective text differs,\n   * normalizes text to the first system node; a series start whose latest\n   * surviving node already holds the rendering leaves it in place.\n   * Normalization empties nonempty later nodes, then rewrites the head if\n   * needed, through logged per-node replacements. An empty rendering always\n   * clears all active system nodes, leaving no older instructions model-visible.\n   * Empty later nodes are dormant and project to no message; an empty head with\n   * no active later node records \"no system prompt\". Restored nonempty text follows\n   * the same route and series rule; empty nodes never restore older text.\n   */\n  'system/message': { turn: number; step: number; message: SystemMessage }\n  /**\n   * Assembled assistant message for one step (derived history uses this).\n   * Carries the step's `usage` when the adapter reported token accounting, so\n   * the model output and its accounting travel together (there is no separate\n   * usage record). `usage` is absent when the adapter reported none. A turn\n   * cancelled mid-stream finalizes its delivered text/reasoning prefix as this\n   * event with `interrupted: true`; undispatched tool calls are absent. The\n   * marker distinguishes that prefix without re-deriving interruption from turn\n   * boundaries. An aborted turn with no such event streamed no visible content.\n   */\n  'assistant/message': {\n    turn: number\n    step: number\n    message: AssistantMessage\n    /** Exact timed model stream, compacted without joining delta boundaries. */\n    stream: AssistantStreamRecord[]\n    usage?: TokenUsage\n    interrupted?: true\n  }\n  /**\n   * One model attempt that committed no surface message. The embedded stream\n   * preserves a failed, retried, cancelled, or stream-error attempt that\n   * reached settlement without fabricating model-visible history.\n   */\n  'assistant/attempt': { turn: number; step: number; stream: AssistantStreamRecord[] }\n  /**\n   * The model requested one tool invocation: `name` with the raw `arguments`\n   * JSON string exactly as the model produced it (unparsed). `callId` pairs the\n   * call with its `tool/result`.\n   */\n  'tool/call': { turn: number; step: number; callId: ToolCallId; name: string; arguments: string }\n  /**\n   * A completed tool call's model-facing result, optional internal failure\n   * identity and user-facing reason, and optional tool-private `meta`\n   * presentation payload. The reason remains outside the model-facing message.\n   * `meta` is\n   * opaque to the core (the producing tool owns its shape and reads it back in\n   * `presentResult`) but MUST be JSON-serializable: `Session.append`\n   * runtime-validates all event data with `isJsonValue`, so a non-serializable\n   * `meta` is rejected at the source, and the durable log reproduces the\n   * identical card on replay. Absent\n   * unless the tool attaches one (e.g. `dsh-tool-fs` carries its result-time\n   * contextual diff here).\n   */\n  'tool/result': {\n    turn: number\n    step: number\n    message: ToolResultMessage\n    /**\n     * Optional failure identity and raw user-facing reason, outside model content;\n     * allowed only when the message has `isError: true`.\n     */\n    error?: { name: string; code: string; reason?: string }\n    meta?: JsonValue\n  }\n  /**\n   * Full header for the next request, appended inside its step before dispatch.\n   * It is log-only; the latest snapshot reconstructs the request header.\n   */\n  'request/header': {\n    header: EpochHeader\n    reason: RequestHeaderReason\n    /** This request begins a distinct model-message series, independently of the header reason. */\n    startsSeries?: true\n  }\n  /**\n   * Route metadata for the next request, logged only when the route, capacity,\n   * or system prompt update mode changes. It does not participate in request\n   * reconstruction or header equality. Prompt admission uses the bound prepared\n   * call's capability, not this snapshot from an earlier request.\n   */\n  'request/context': RequestContext","hash":"b4c9f1985818"},{"id":"tools-execute","file":"packages/core/tools/src/index.ts","start":369,"end":377,"label":"ctx.tools.execute() · 批次委派","note":"按 Agent 所在作用域选择执行器，把原始调用批次整体交给它。","code":"  /**\n   * Delegate a raw call batch to its Agent's provider or the deployment default.\n   * Select at dispatch; accepted batches settle through that provider even if it unloads.\n   * @param input - original calls, optional owning Agent, and optional logging step.\n   * @returns the selected executor's settled batch; unavailable selections reject.\n   */\n  async execute(input: ToolBatchInput): Promise<ToolBatchResult> {\n    return this.selectExecutor(input.agent).execute(input)\n  }","hash":"15ea1096da5e"},{"id":"tools-prepare","file":"packages/core/tools/src/pipeline.ts","start":184,"end":233,"label":"tools/pre-execute · 策略、审批与 guard","note":"waterfall 决策 allow / ask / deny / cancel；ask 走 approval seam，随后再跑单调 guard。","code":"  /**\n   * Snapshot input, assign its correlation token, and run ordered pre-execute\n   * policy and guards. Cancellation skips a body that has not started.\n   * @param input - the caller-supplied execution input.\n   * @returns the prepared execution plus the next scheduler stage.\n   */\n  async prepare(input: ToolExecutionInput): Promise<ScheduledToolPreparation> {\n    const created = this.createExecution(input)\n    if (created.kind !== 'ready') return created\n    const exec = created.exec\n    if (this.callerCancelled(exec)) {\n      return { kind: 'final-result', exec, result: toolAbortedBeforeDispatchResult() }\n    }\n    try {\n      const carrier = scopeTarget(this.tools, exec.agent)\n      const gate = await this.ctx.waterfall(\n        carrier, 'tools/pre-execute', exec,\n        () => Promise.resolve<PreToolDecision>({ kind: 'allow' }),\n      )\n      const askResolution = gate.kind === 'ask'\n        ? await this.serviceAsk(exec, gate)\n        : { decision: gate, approvalCancelled: false }\n      const { decision } = askResolution\n      if (this.callerCancelled(exec) && askResolution.approvalCancelled) {\n        return { kind: 'post-result', exec, result: toolAbortedBeforeDispatchResult() }\n      }\n      if (decision.kind === 'cancel') {\n        return { kind: 'post-result', exec, result: toolAbortedBeforeDispatchResult() }\n      }\n      const denialReason = decision.kind === 'allow' ? this.tools.checkGuards(exec) : decision.reason\n      const denialInfo = decision.kind === 'deny' ? decision.info : undefined\n      if (denialReason !== undefined) {\n        return {\n          kind: 'post-result',\n          exec,\n          result: this.materializeFinalResult({\n            content: [{ type: 'text', text: `Error: ${denialReason}` }],\n            isError: true,\n            error: { message: denialReason, ...denialInfo === undefined ? {} : { info: denialInfo } },\n          }),\n        }\n      }\n      if (this.callerCancelled(exec)) {\n        return { kind: 'post-result', exec, result: toolAbortedBeforeDispatchResult() }\n      }\n      return { kind: 'dispatch', exec }\n    } catch (error: unknown) {\n      return { kind: 'final-result', exec, result: toolErrorResult(error) }\n    }\n  }","hash":"95645937e56c"},{"id":"tools-dispatch","file":"packages/core/tools/src/pipeline.ts","start":288,"end":325,"label":"tools/execute · 包裹工具体","note":"外层 waterfall 可替换执行方式；工具名解析失败抛 ToolNotFoundError，错误统一转成 isError 结果。","code":"  /**\n   * Run around-dispatch and the tool body. Tool and unknown-tool failures still\n   * receive post-execute; pipeline failures are already final. Started bodies\n   * drain on cancellation before a successful outcome becomes `ABORTED`.\n   * @param exec - the execution returned by this pipeline's prepare stage.\n   * @returns whether the result still needs post-execute.\n   */\n  async dispatch(exec: ToolRunContext): Promise<ScheduledToolDispatch> {\n    try {\n      const mutableExec = exec as MutableToolRunContext\n      const carrier = scopeTarget(this.tools, exec.agent)\n      const result = await this.ctx.waterfall(\n        carrier, 'tools/execute', mutableExec,\n        () => this.dispatchToolBody(mutableExec),\n      )\n      const normalized = this.normalizeDispatchResult(exec, result)\n      const deferredContexts = this.deferredContexts.get(exec)\n      /* v8 ignore next -- dispatch only receives executions minted by this registry's prepare stage */\n      if (deferredContexts === undefined) throw new Error('tool registry scheduler invariant violated: unprepared execution')\n      const resultWithDeferredContexts: ToolExecutionResult = deferredContexts.length === 0\n        ? normalized\n        : this.markCanonical(exec, {\n          ...normalized,\n          additionalContexts: [\n            ...deferredContexts,\n            ...normalized.additionalContexts ?? [],\n          ],\n        })\n      return {\n        kind: 'post-result',\n        result: this.callerCancelled(exec) && !resultWithDeferredContexts.isError\n          ? this.cancellationResult(exec, resultWithDeferredContexts)\n          : resultWithDeferredContexts,\n      }\n    } catch (error: unknown) {\n      return { kind: 'final-result', result: toolErrorResult(error) }\n    }\n  }","hash":"d1b0af5b8e63"},{"id":"tools-post","file":"packages/core/tools/src/pipeline.ts","start":475,"end":524,"label":"tools/post-execute · 结果策略","note":"accept / block 两种决策；可替换 content 或 value，并携带 additionalContexts 回到循环。","code":"  /**\n   * Run the `tools/post-execute` waterfall over a dispatched `result` and apply\n   * its {@link PostToolDecision}: `accept` keeps the call successful (replacing\n   * `content` when given), `block` turns it into an `isError` whose content is\n   * the corrective `feedback`. Either decision may attach `additionalContexts`,\n   * which are ferried on the returned result for the loop's active-batch FIFO.\n   * Context deferred by the tool body survives an accepted result but is\n   * discarded when the outer call is blocked; a block exposes only context the\n   * blocking decision explicitly supplied.\n   * Runs inside `execute`'s outer try/catch (a throwing listener → isError).\n   */\n  private async postExecute(exec: ToolExecution, result: ToolExecutionResult): Promise<ToolExecutionResult> {\n    const decision = await this.ctx.waterfall(\n      scopeTarget(this.tools, exec.agent), 'tools/post-execute', exec, result,\n      () => Promise.resolve<PostToolDecision>({ kind: 'accept' }),\n    )\n    const decisionContexts = decision.additionalContexts ?? []\n    if (decision.kind === 'block') {\n      const message = failureMessageFromContent(decision.feedback)\n      return this.markCanonical(exec, {\n        content: decision.feedback,\n        isError: true,\n        error: { message },\n        ...decisionContexts.length > 0 ? { additionalContexts: decisionContexts } : {},\n      })\n    }\n    if (Object.hasOwn(decision, 'content') && Object.hasOwn(decision, 'value')) {\n      throw new TypeError('tools/post-execute accept decision cannot replace both value and content')\n    }\n    const additionalContexts = [\n      ...result.additionalContexts ?? [],\n      ...decisionContexts,\n    ]\n    if (Object.hasOwn(decision, 'value')) {\n      if (result.isError) {\n        throw new TypeError('tools/post-execute cannot replace the value of a failed result')\n      }\n      const tool = this.resolveExecution(exec.name, exec.agent, exec.parent !== undefined, exec.toolSet)\n      if (tool === undefined) throw new ToolNotFoundError(exec.name)\n      const replaced = this.createSuccessResult(exec, tool, decision.value)\n      return this.markCanonical(exec, {\n        ...replaced,\n        ...additionalContexts.length > 0 ? { additionalContexts } : {},\n      })\n    }\n    return this.markCanonical(exec, {\n      ...result,\n      ...decision.content !== undefined ? { content: decision.content } : {},\n      ...additionalContexts.length > 0 ? { additionalContexts } : {},\n    })","hash":"ec07fe4ded1d"},{"id":"llm-prepare","file":"packages/llm/llm/src/index.ts","start":960,"end":1018,"label":"ctx.llm.prepareCall() · 绑定适配器代际","note":"解析模型信息、补齐默认值并冻结 config；返回的 stream 只能派发一次，防止 HMR 混淆两代适配器。","code":"  async prepareCall(\n    config: LlmCallConfig,\n    signal?: AbortSignal,\n    configure?: ConfigureCall,\n  ): Promise<PreparedLlmCall> {\n    signal?.throwIfAborted()\n    const { provider, model, ...controls } = config\n    const registration = this.registration(provider)\n    const adapterCall = await registration.adapter.prepareCall(provider, model, signal)\n    signal?.throwIfAborted()\n    const modelInfo = this.normalizeModelInfo(registration, model, adapterCall.model)\n    const proposed = configure === undefined\n      ? config\n      : { ...configure(deepFreeze(structuredClone(controls)), deepFreeze(modelInfo)), provider, model }\n    signal?.throwIfAborted()\n    const resolved = this.resolveCallWithInfo(proposed, modelInfo)\n    const resolvedConfig = deepFreeze(structuredClone(resolved.config))\n    const context = resolved.context === undefined\n      ? undefined\n      : deepFreeze(structuredClone(resolved.context))\n    const adapterDefaults = deepFreeze<LlmCallConfigAdapterDefaults>({\n      ...proposed.reasoningEffort === undefined && resolvedConfig.reasoningEffort !== undefined\n        ? { reasoningEffort: true }\n        : {},\n      ...proposed.maxTokens === undefined && resolvedConfig.maxTokens !== undefined\n        ? { maxTokens: true }\n        : {},\n    })\n    let dispatched = false\n    return Object.freeze({\n      config: resolvedConfig,\n      retryPolicy: registration.retryPolicy,\n      adapterDefaults,\n      ...context === undefined ? {} : { context },\n      ...modelInfo.inputModalities === undefined\n        ? {}\n        : { inputModalities: Object.freeze([...modelInfo.inputModalities]) },\n      ...modelInfo.systemPromptUpdate === undefined ? {} : { systemPromptUpdate: modelInfo.systemPromptUpdate },\n      ...modelInfo.toolUpdate === undefined ? {} : { toolUpdate: modelInfo.toolUpdate },\n      stream: (options: GenerateOptions): AsyncIterable<StreamChunk> => {\n        if (dispatched) {\n          throw new LlmError('a prepared LLM call can only be dispatched once', 'INVALID_PREPARED_CALL')\n        }\n        if (!callConfigEquals(options, resolvedConfig)) {\n          throw new LlmError(\n            'prepared LLM call config changed before adapter dispatch',\n            'INVALID_PREPARED_CALL',\n          )\n        }\n        dispatched = true\n        return this.streamWithRegistration(options, {\n          registration,\n          config: resolvedConfig,\n          modelInfo,\n          dispatch: options => adapterCall.stream(options),\n        })\n      },\n    })\n  }","hash":"da75e0cc83aa"},{"id":"llm-stream","file":"packages/llm/llm/src/index.ts","start":1159,"end":1184,"label":"ctx.llm.stream() · llm/stream 瀑布","note":"所有模型调用都经过 llm/stream waterfall，监听器可包装/替换流；失败归一化为终止 chunk。","code":"  /**\n   * Stream one model call as raw chunks (token-level deltas). Replay state is\n   * retained only when the same adapter instance owns its historical provider\n   * and the target provider. Final adapter selection remains fixed through\n   * asynchronous exact-model resolution and dispatch. Adapter selection,\n   * dispatch, and iteration failures become terminal `error` or `aborted`\n   * finish chunks; middleware, nested-call, cleanup, and consumer failures\n   * remain thrown.\n   * @param options - the full request; `options.provider` selects the adapter.\n   * @returns the chunk stream, possibly wrapped by `llm/stream` listeners.\n   */\n  stream(options: GenerateOptions): AsyncIterable<StreamChunk> {\n    return this.streamWithRegistration(options)\n  }\n\n  private streamWithRegistration(\n    options: GenerateOptions,\n    prepared?: PreparedDispatch,\n  ): AsyncIterable<StreamChunk> {\n    return this.ctx.waterfall(\n      this,\n      'llm/stream',\n      options,\n      () => this.adapterStream(options, prepared),\n    )\n  }","hash":"1559fe328757"},{"id":"llm-chunks","file":"packages/llm/llm/src/types.ts","start":488,"end":508,"label":"StreamChunk · 适配器流协议","note":"块索引关联交错的增量；block-end 携带组装好的内容块，finish 之前的 usage 单独成帧。","code":"/**\n * Raw streaming protocol emitted by adapters.\n * Block indexes correlate interleaved deltas, and `block-end` carries the\n * assembled block. Adapters emit usage before the terminal finish and nothing\n * afterward; tool arguments remain raw JSON strings. An adapter implementation\n * may throw, but `LlmRuntime.stream()` normalizes that failure to a terminal\n * `error` or `aborted` finish before exposing it to consumers.\n */\nexport type StreamChunk =\n  | { type: 'block-start'; index: number; blockType: ContentBlockType }\n  | { type: 'text-delta'; index: number; text: string }\n  | { type: 'reasoning-delta'; index: number; text: string }\n  | { type: 'tool-call-delta'; index: number; id: ToolCallId; name?: string; argumentsDelta: string }\n  | { type: 'block-end'; index: number; block: ContentBlock }\n  | { type: 'usage'; usage: TokenUsage }\n  | {\n    type: 'finish'\n    reason: FinishReason\n    /** Replay metadata for a successful response; see {@link ReplayEnvelope}. */\n    replayState?: ReplayEnvelope\n  }","hash":"93bb28a9a193"},{"id":"llm-request","file":"packages/llm/llm/src/types.ts","start":560,"end":606,"label":"GenerateOptions · 一次模型请求","note":"provider/model、消息、工具 schema、toolHistory、采样参数与取消信号；循环构建的请求不填 system 字段。","code":"/**\n * A single model request, fully assembled.\n * @typeParam Purpose - declared purpose keys for callers; forwarding adapters may accept `string`.\n */\nexport interface GenerateOptions<Purpose extends string = LlmRequestPurpose> {\n  /** Registered provider route selecting the adapter instance. */\n  provider: string\n  model: string\n  /** Adapter-owned reasoning effort selected for this exact model. */\n  reasoningEffort?: ReasoningEffortId\n  /**\n   * Ordered conversation messages, exactly as the provider sees them. A\n   * loop-built request passes the derived history (dsh-agent-loop), whose\n   * leading system-role message carries the system prompt; a hand-built\n   * one-shot may include identity-free user inputs.\n   */\n  messages: RequestMessage[]\n  /**\n   * System prompt text for one-shot callers; adapters map it to the provider's\n   * system slot ahead of `messages`. Loop-built requests leave it undefined.\n   */\n  system?: string\n  /** Tool schemas (adapters map to the provider's `tools` field). */\n  tools?: ToolSchema[]\n  /** Session-folded tool history used for route projection; omission sends complete declarations without tool updates. */\n  toolHistory?: ToolHistory\n  temperature?: number\n  maxTokens?: number\n  /**\n   * Stop sequences: generation halts as soon as the model produces any one of\n   * these strings (adapters map to the provider's stop field, e.g. OpenAI\n   * `stop`). The stop string itself is not included in the output.\n   */\n  stop?: string[]\n  signal?: AbortSignal\n  /**\n   * Session identity stamped by the loop for request routing. Replay uses it\n   * to separate cursors; adapters may map it to model-hidden transport metadata.\n   */\n  sessionId?: Branded<'SessionId'>\n  /**\n   * Provider-neutral classification for an auxiliary model call. Adapters may\n   * map the purpose to model-hidden transport metadata. Ordinary conversation\n   * requests leave it unset.\n   */\n  purpose?: Purpose\n}","hash":"a997e6182528"},{"id":"prompt-assemble","file":"packages/core/system-prompt/src/index.ts","start":610,"end":694,"label":"ctx.systemPrompt.assemble() · 提示词组装","note":"合并全局与作用域的 section/context/variable，收集可见工具 schema，最后跑 system-prompt/assemble 瀑布。","code":"  /**\n   * Assemble global and scoped providers, detach tool parameters, apply\n   * canonical ordering, then run the presentation waterfall. Scoped sections\n   * and variables shadow globals. The waterfall's text is authoritative except\n   * that an effective complete section is restored afterwards as the sole\n   * prompt section; tool declarations stay provider-owned.\n   * @param context - the optional scope, step tool set, and plugin-defined assembly fields.\n   * @returns the post-waterfall assembly with ordered tool declarations and any complete prompt enforced.\n   */\n  // Keep configuration failures on the declared asynchronous error path.\n  async assemble(context: AssembleContext = {}): Promise<PromptAssembly> {\n    const scope = context.scope\n    const scopeLayers = this.layers.chainLayers(scope)\n    const runtimeContextSuppressed = !this.layers.global.runtimeContextSuppressors.isEmpty()\n      || scopeLayers.some(layer => !layer.runtimeContextSuppressors.isEmpty())\n    // Scoped variables shadow globals.\n    const variables: Record<string, string | undefined> = {}\n    for (const [name, provider] of this.layers.global.variables.entries()) {\n      variables[name] = provider(context)\n    }\n    // Scope-chain variables, farthest first, so the nearest scope wins a name.\n    for (const layer of scopeLayers) {\n      for (const [name, provider] of layer.variables.entries()) {\n        variables[name] = provider(context)\n      }\n    }\n    // Scoped sections shadow globals before the deterministic order sort.\n    const sectionByName = this.layers.merge(scope, layer => layer.sections)\n    const contextByName = this.layers.merge(scope, layer => layer.contexts)\n    // Validate order against pre-restriction names while collecting visible schemas.\n    const providers = [\n      ...this.layers.global.toolProviders.values(),\n      ...scopeLayers.flatMap(layer => [...layer.toolProviders.values()]),\n    ]\n    const collected: ToolSchema[] = []\n    const knownNames = new Set<string>()\n    for (const provider of providers) {\n      const result = provider(context)\n      const schemas = result.schemas.map(({ name, description, parameters, deferLoading }): ToolSchema => ({\n        name,\n        description,\n        parameters: structuredClone(parameters),\n        ...deferLoading === true ? { deferLoading } : {},\n      }))\n      const acceptedKnownNames = result.knownNames ?? schemas.map(tool => tool.name)\n      collected.push(...schemas)\n      for (const name of acceptedKnownNames) knownNames.add(name)\n    }\n    const sectionDefinitions = [...sectionByName.values()].sort(comparePromptSections)\n    const completeSections = sectionDefinitions.filter(section => section.complete === true)\n    if (completeSections.length > 1) {\n      throw new Error(`multiple complete prompt sections are active: ${completeSections.map(section => JSON.stringify(section.name)).join(', ')}`)\n    }\n    let completeSection: AssembledSection | undefined\n    const sections = sectionDefinitions\n      .map((section) => {\n        const assembled = {\n          name: section.name,\n          text: typeof section.text === 'function' ? section.text(context) : section.text,\n          ...section.interpolate !== undefined ? { interpolate: section.interpolate } : {},\n        }\n        if (section.complete === true) completeSection = { ...assembled }\n        return assembled\n      })\n    const tools = orderTools(collected, this.toolOrder, knownNames)\n    const assembly: PromptPresentation = {\n      sections,\n      contexts: [...contextByName.values()]\n        .filter(entry => !runtimeContextSuppressed || entry.required === true)\n        .sort((a, b) => a.order - b.order)\n        .map(entry => resolveContext(entry, context)),\n      variables,\n    }\n    const transformed = await this.ctx.waterfall(\n      scopeTarget(this, scope), 'system-prompt/assemble', assembly, context,\n      () => Promise.resolve(assembly),\n    )\n    if (completeSection === undefined && !runtimeContextSuppressed) return { ...transformed, tools }\n    const requiredContexts = new Set([...contextByName.values()].filter(entry => entry.required === true).map(entry => entry.name))\n    return {\n      ...transformed,\n      tools,\n      sections: completeSection === undefined ? transformed.sections : [completeSection],\n      contexts: runtimeContextSuppressed ? transformed.contexts.filter(entry => requiredContexts.has(entry.name)) : transformed.contexts,\n    }","hash":"b1d288fc896a"},{"id":"rpc-prompt","file":"packages/api/session-controller/src/index.ts","start":461,"end":492,"label":"@Remote('prompt') · RPC 入口","note":"网关校验后进入：内容非空白、时区合法，构造 MessageSource（user / retry + rpcId），交给 commands.prompt。","code":"  /**\n   * Admit one prompt after explicitly resuming its Session.\n   * @param request - Session identity, prompt content, source metadata, and delivery mode.\n   * @param signal - caller cancellation before prompt admission begins.\n   * @returns acknowledgement that the Agent accepted the prompt.\n   */\n  @Remote('prompt')\n  async prompt(request: SessionPromptRequest, signal: AbortSignal): Promise<SessionPromptValue> {\n    signal.throwIfAborted()\n    if (request.content.length > 0 && !hasPromptContent(request.content)) {\n      throw new RemoteError('gateway/bad-request', 'prompt content must include non-whitespace text or an attachment', {})\n    }\n    const clientTimeZone = request.clientTimeZone === undefined\n      ? undefined\n      : canonicalClientTimeZone(request.clientTimeZone)\n    if (request.clientTimeZone !== undefined && clientTimeZone === undefined) {\n      throw new RemoteError(\n        'session/invalid-time-zone',\n        'clientTimeZone must be UTC or a valid IANA Area/Location name',\n        { value: request.clientTimeZone },\n      )\n    }\n    // The caller is recorded only when it is not the owner, so owner messages keep their exact source.\n    const principal = principalOf(this.ctx.invocation)\n    const source: MessageSource = {\n      kind: request.content.length === 0 ? 'retry' : 'user',\n      rpcId: request.requestId,\n      ...(clientTimeZone === undefined ? {} : { clientTimeZone }),\n      ...(principal === undefined ? {} : { principal }),\n    }\n    return this.commands.prompt(request, source)\n  }","hash":"3c0653e8b9a8"},{"id":"commands-prompt","file":"packages/api/session-controller/src/commands.ts","start":321,"end":387,"label":"prompt 准入 → agent.followup / steer","note":"先幂等检查 requestId，再解析附件与图片模态；queue 走 followup，steer 走 agent.steer。","code":"  async prompt(request: SessionPromptRequest, source: MessageSource): Promise<SessionPromptValue> {\n    const agent = await this.resolveAgent(request.sessionId)\n    if (this.hasPromptRequest(agent.session, request.requestId)) return { accepted: true }\n    if (request.content.length === 0) {\n      try {\n        return await agent.runMaintenance(() => {\n          const inbox = agent.inbox\n          if (request.mode !== 'queue' || this.continuation.stateOf(agent.session).ending === null\n            || inbox.nextTurn.length > 0 || inbox.nextStep.some(message => message.source.kind === 'user')) {\n            throw new RemoteError('session/agent-busy', 'generation continuation is unavailable', { reason: 'NO_CONTINUABLE_FAILURE_OR_PENDING_INPUT' })\n          }\n          agent.followup(createUserMessage({ content: [], source }))\n          return Promise.resolve({ accepted: true as const })\n        })\n      } catch (error: unknown) {\n        if (remoteErrorOf(error) !== undefined) throw error\n        throw new RemoteError('session/agent-busy', 'generation continuation was not accepted', { reason: String(error) })\n      }\n    }\n    const admission = resolvePromptFileReceipts(\n      request.content,\n      receiptId => this.ctx.fileUploads.resolve(agent, receiptId),\n    )\n    // Encoded images and image upload receipts both make an image prompt.\n    const hasImage = admission.content.some(part => part.type === 'image')\n    const admit = async (): Promise<SessionPromptValue> => {\n      try {\n        if (this.hasPromptRequest(agent.session, request.requestId)) return { accepted: true }\n        if (hasImage) {\n          const current = agent.model.current()\n          if (current !== undefined) {\n            const model = await this.ctx.llm.resolveModelInfo(current.provider, current.model)\n            if (model.inputModalities !== undefined && !model.inputModalities.includes('image')) {\n              throw new RemoteError(\n                'session/attachment-invalid',\n                `Model \"${current.model}\" does not support image input.`,\n                { reason: 'MODEL_DOES_NOT_SUPPORT_IMAGES' },\n              )\n            }\n          }\n        }\n        const content = await this.ctx.attachments.admitPromptContent(admission.content)\n        if (this.hasPromptRequest(agent.session, request.requestId)) return { accepted: true }\n        const message: UserMessage = createUserMessage({ content, source })\n        if (this.ctx.agents.get(agent.id) !== agent) {\n          throw new RemoteError(\n            'session/not-found',\n            `session \"${agent.id}\" was disposed during prompt admission`,\n            { sessionId: agent.id },\n          )\n        }\n        using binding = this.ctx.fileUploads.bindPrompt(agent, admission.receiptIds, request.requestId)\n        if (request.mode === 'steer') agent.steer(message)\n        else agent.followup(message)\n        binding.commit()\n      } catch (error) {\n        if (this.hasPromptRequest(agent.session, request.requestId)) return { accepted: true }\n        if (remoteErrorOf(error) !== undefined) throw error\n        if (error instanceof AttachmentError) {\n          throw new RemoteError('session/attachment-invalid', error.message, { reason: error.code })\n        }\n        throw new RemoteError('session/agent-busy', 'prompt rejected', { reason: String(error) })\n      }\n      return { accepted: true }\n    }\n    return hasImage ? this.agents.serializeImageAdmission(agent, admit) : admit()\n  }","hash":"cb19617c8883"},{"id":"client-prompt","file":"packages/api/session-controller/src/client/sessions/session.ts","start":245,"end":299,"label":"客户端 session.prompt() · 发起 RPC","note":"浏览器侧 Session 句柄把 queue/steer、requestId、时区发给 remote.session.prompt；子 Agent 走 subagents.prompt。","code":"\n  /**\n   * Send (queue/steer passed through 1:1); failures land in the snapshot's\n   * promptError. The Host can hold the prompt at its admission stage, so the\n   * call can stay open; the echo appears and the blank → engaging edge flips\n   * only once the Host accepts the prompt.\n   * @param content - text, browser-owned temporary image uploads, and staged-file receipts.\n   * @param mode - queue appends after the current turn; steer interrupts it.\n   * @param signal - optional caller cancellation for the complete admission round-trip.\n   * @param requestId - identity from {@link beginSubmission}; a failed identified prompt retires its echo.\n   * @returns the prompt result (also mirrored into promptError on failure).\n   */\n  async prompt(\n    content: PromptContentPart[],\n    mode: 'queue' | 'steer',\n    signal?: AbortSignal,\n    requestId?: SessionRequestId,\n  ): Promise<RemoteResult<{ accepted: true }>> {\n    this.promptError = null\n    this.lastAgentError = null\n    // Before the first await, so a turn observed ahead of the receipt clears it.\n    const firstPrompt = this.blankBit && !this.firstPromptPendingTurn\n    if (firstPrompt) this.firstPromptPendingTurn = true\n    let result: RemoteResult<{ accepted: true }>\n    if (this.address === undefined) {\n      const clientTimeZone = resolvedClientTimeZone()\n      result = await this.remote.session.prompt({\n        requestId: requestId ?? randomUUID() as SessionRequestId,\n        sessionId: this.sessionId,\n        mode,\n        content,\n        clientTimeZone,\n      }, signal)\n    } else if (content.some(part => part.type === 'file')) {\n      result = {\n        ok: false,\n        error: new RemoteError(\n          'subagent/attachment-invalid',\n          'subagent continuation does not accept files',\n          { reason: 'SUBAGENT_FILE_UNSUPPORTED' },\n        ),\n      }\n    } else {\n      // The preceding branch rejects file parts before the narrower subagent\n      // wire type is used; this array is not filtered or reordered.\n      const routedContent = content as Exclude<PromptContentPart, { readonly type: 'file' }>[]\n      const routed = await this.remote.subagents.prompt({\n        requestId: requestId ?? randomUUID() as SessionRequestId,\n        childSessionId: this.address.childSessionId,\n        delivery: mode,\n        content: routedContent,\n        clientTimeZone: resolvedClientTimeZone(),\n      }, signal)\n      result = routed.ok ? { ok: true, value: { accepted: true } } : routed\n    }","hash":"cd95fb59a5b8"},{"id":"ui-send","file":"packages/client/ui-conversation/src/client/service.ts","start":203,"end":213,"label":"会话输入框提交 · conversation.send()","note":"最简单的一条发送路径：文本块交给 scopedSession.prompt(content, 'queue')。","code":"  /**\n   * Send a prompt into the scoped session. Business failures also land in the\n   * session snapshot's promptError (object-layer state); the rejection here\n   * exists for caller choreography (the composer restores the draft on it).\n   * @param text - prompt text, sent verbatim as one text block.\n   */\n  async send(text: string): Promise<void> {\n    const session = this.scopedSession('send')\n    const result = await session.prompt([{ type: 'text', text }], 'queue')\n    if (!result.ok) throw new Error(`conversation.send failed: ${result.error.code}: ${result.error.message}`)\n  }","hash":"0a17cdbdb03a"},{"id":"stream-bridge","file":"packages/api/session-controller/src/history/assistant-stream.ts","start":11,"end":42,"label":"agent/assistant-stream → 远程流","note":"进程内 live 事件由 session-controller 累积，按连接订阅转成 assistant-stream 帧推给浏览器。","code":"/** One accumulator per live Session, shared by every subscription bound to it. */\nexport class SessionAssistantStreamsListener {\n  private readonly streams = new Map<SessionId, SessionAssistantStreamAccumulator>()\n\n  /** @param ctx - service context owning the accumulator listeners. */\n  constructor(private readonly ctx: Context) {\n    ctx.on('agent/assistant-stream', ({ agent, frame }) => {\n      let stream = this.streams.get(agent.session.id)\n      if (stream === undefined) {\n        stream = new SessionAssistantStreamAccumulator()\n        this.streams.set(agent.session.id, stream)\n      }\n      stream.accept(frame, agent.session.seq === 0 ? -1 : SessionSeq(agent.session.seq - 1))\n    }, { global: true })\n    ctx.on('agent/disposed', ({ agent }) => { this.streams.delete(agent.session.id) }, { global: true })\n    ctx.effect(() => () => { this.streams.clear() }, 'session-controller.assistant-streams')\n  }\n\n  /**\n   * Bind one connection to a Session assistant stream.\n   * @param sessionId - Session to subscribe.\n   * @param signal - cancellation owned by the caller.\n   * @param queue - caller-owned raw notification buffer.\n   * @returns a listener the caller disposes.\n   */\n  bind(sessionId: SessionId, signal: AbortSignal,\n    queue: Pick<ListenerBuffer<AssistantEntry>, 'createInput' | 'capture'>): AssistantStreamListener {\n    return new AssistantStreamListener(this.ctx, sessionId, signal, () => {\n      return this.streams.get(sessionId)?.snapshot() ?? { revision: 0 }\n    }, queue)\n  }\n}","hash":"42190268799c"},{"id":"headless-run","file":"packages/bundle/headless/src/index.ts","start":379,"end":430,"label":"Headless runner · 一次性驱动","note":"通过 ctx.agents.create() 创建 Agent，followup 投递任务，whenIdle() 等待收敛后输出最终文本。","code":"        configured.reasoningEffort = previous.reasoningEffort\n      }\n      agent.model.select(configured)\n    }\n    installModelSelection(agentCtx)\n  }\n  const sessionId = brandString<SessionId>(config.sessionId ?? `session-${randomUUID()}`)\n  const fs = ctx.get('fs')\n  const cwd = fs === undefined ? process.cwd() : fs.processPath(await fs.resolve('.'))\n  const agent = config.sessionId === undefined\n    ? (await agents.create({\n      sessionId,\n      meta: { cwd },\n      agentOptions,\n      setup,\n    })).agent\n    : await resolveAgent(ctx, agents, sessionId, agentOptions, setup, cwd)\n  await agent.whenIdle()\n  if (config.sessionId !== undefined) {\n    // The resume-time check read a snapshot; an overlay can still append a\n    // preset selection between it and the interval this run now owns, so\n    // re-read the log the runner holds before submitting the task.\n    assertAdoptable(agent.session.header, liveEvents(agent.session), sessionId, cwd)\n  }\n  if (permissionMode !== undefined && permissions !== undefined) permissions.set(agent.session, permissionMode)\n  if (approvalPolicy !== undefined && approval?.overrideOf(agent.session) !== approvalPolicy) {\n    setApprovalPolicy(agent.session, approvalPolicy)\n  }\n  const firstSeq = agent.session.seq\n  const projection = config.json === true ? projectJsonRun(ctx, agent, io.stdout, { cwd }) : undefined\n  const stopReasoning = projection === undefined ? streamReasoning(ctx, agent, io.stderr) : undefined\n  let failure: { error: unknown; atOffset: SessionLogOffset } | undefined\n  const stopErrors = ctx.on('agent/error', ({ agent: subject, error }) => {\n    if (subject === agent) failure = { error, atOffset: agent.session.seq }\n  })\n  const stopTerminals = ctx.on('session/event', (session, event) => {\n    if (session === agent.session && event.type === 'turn/end'\n      && failure !== undefined && event.seq >= failure.atOffset) failure = undefined\n  })\n  try {\n    try {\n      agent.followup(createUserMessage({\n        content: [{ type: 'text', text: task }],\n        source: { kind: 'user' },\n      }))\n      const subagents = ctx.get('subagents')\n      while (true) {\n        await agent.whenIdle()\n        const idleSeq = agent.session.seq\n        // Child settlement can wake the parent before the child wait observes it.\n        if (!await subagents?.waitForTreeWork(agent)\n          && agent.status === 'idle' && agent.session.seq === idleSeq) break","hash":"a99a96880d72"},{"id":"tools-resolve","file":"packages/core/tools/src/index.ts","start":264,"end":297,"label":"ctx.tools.resolve() · 本 Step 的可见工具集","note":"每个 Step 按 Agent 作用域重新解析一次可见工具；when() 读取条件，取消或条件失败都不发布半成品。","code":"  async resolve(context: ToolActivationContext): Promise<ResolvedToolSet> {\n    const { agent, signal } = context\n    signal.throwIfAborted()\n    const view = this.view(agent)\n    const admitted = new Map<string, ToolDefinition>()\n    for (const [name, definition] of view.visible) {\n      const registration = view.registrations.get(name)\n      let enabled: boolean\n      try {\n        enabled = registration?.when === undefined || await registration.when(context)\n      } catch (cause: unknown) {\n        signal.throwIfAborted()\n        throw new ToolActivationError(name, cause)\n      }\n      signal.throwIfAborted()\n      if (enabled) admitted.set(name, definition)\n    }\n    let closed = false\n    return Object.freeze({\n      dispose: () => { closed = true },\n      view: (scope: ScopeKey | undefined): ReadonlyMap<string, ToolDefinition> => {\n        const visible = new Map<string, ToolDefinition>()\n        if (closed || scope !== agent) return visible\n        const current = this.view(agent)\n        for (const [name, definition] of admitted) {\n          if (current.visible.get(name) === definition\n            && current.registrations.get(name) === view.registrations.get(name)) {\n            visible.set(name, definition)\n          }\n        }\n        return visible\n      },\n    })\n  }","hash":"47dc985b7761"},{"id":"approval-request","file":"packages/interaction/user-approval/src/types.ts","start":78,"end":92,"label":"approval/request · 审批瀑布","note":"审批是 waterfall：监听器返回 outcome 即认领请求，或调用 next() 交给下一个审批者；按 Agent 作用域过滤。","code":"declare module '@deepseek-ai/cordis' {\n  interface Events {\n    /**\n     * Ask composed answerers for one decision. Return an outcome to claim the\n     * request or call `next()` to delegate. Scope-filtered dispatch\n     * (`@deepseek-ai/dsh-scope`): agent-scoped listeners receive only that agent.\n     * @param req - pending approval request.\n     * @mode waterfall\n     */\n    'approval/request'(\n      this: Scoped<Agent>,\n      req: ApprovalRequestEvent,\n      next: () => Promise<ApprovalOutcome>,\n    ): Promise<ApprovalOutcome>\n  }","hash":"a7fa58acb516"},{"id":"tool-batch","file":"packages/core/tools/src/batch.ts","start":236,"end":269,"label":"BatchSettlement · tool/call 与 tool/result 落日志","note":"工具批次开始时 append tool/call，提交结果时 append tool/result，并把 additionalContexts 收回给循环。","code":"/** Collect committed results and optionally append their durable Session events. */\nclass BatchSettlement {\n  private readonly results: ToolCallResult[] = []\n  private readonly contexts: UserMessage[] = []\n\n  constructor(private readonly input: ToolBatchInput) {}\n\n  start(block: ToolCallBlock): SessionSeq | undefined {\n    if (this.input.log === undefined) return undefined\n    const { agent, log: { turn, step } } = this.input\n    // oxlint-disable-next-line typescript/no-non-null-assertion -- ToolBatchInput requires agent whenever log is provided\n    return agent!.session.append('tool/call', {\n      turn, step, callId: block.id, name: block.name, arguments: block.arguments,\n    }).seq\n  }\n\n  commit(block: ToolCallBlock, result: ToolExecutionResult, callSeq: SessionSeq | undefined): void {\n    if (this.input.log !== undefined) {\n      const { agent, log: { turn, step } } = this.input\n      // oxlint-disable-next-line typescript/no-non-null-assertion -- ToolBatchInput requires agent whenever log is provided\n      agent!.session.append('tool/result', {\n        turn, step,\n        message: createToolResultMessage({ callId: block.id, content: result.content, isError: result.isError }),\n        ...result.error?.info ? { error: result.error.info } : {},\n        ...result.meta !== undefined ? { meta: result.meta } : {},\n      }, {\n        surfaceOp: 'append',\n        // oxlint-disable-next-line typescript/no-non-null-assertion -- start records a call seq whenever this batch logs results\n        sourceEventSeqs: [callSeq!],\n      })\n    }\n    this.results.push({ callId: block.id, result })\n    this.contexts. e":"vitest.config.ts / e2e / snapshot / web / web-stress / web.perf 各一套；DSH_SNAPSHOT=record|replay 控制快照模式。","packages":["root devDependencies"],"files":[{"path":"vitest.config.ts","line":1,"symbol":"vitest config"}],"why":"Agent 循环是并发与取消密集型的，只有快照 + e2e 才能守住行为不回归。","status":"源码确认","tags":["测试"]},{"id":"oxlint","name":"oxlint 1.81","layer":"lang","role":"全仓 lint 与规则门禁。","usage":"`pnpm run lint` 先编译 host contracts，再用 oxlint 扫描；`verify-*` 脚本组成 doc-sync / hygiene 门禁。","packages":["root scripts.lint"],"files":[{"path":".oxlintrc.json","line":1,"symbol":"oxlint rules"}],"why":"插件边界、类型断言、事件调用点都有专门规则，避免架构约束被悄悄绕过。","status":"源码确认","tags":["工程"]},{"id":"cordis","name":"Cordis","layer":"runtime","role":"插件框架：Context、Service、事件、作用域。","usage":"每个能力（模型适配器、工具注册表、会话日志，甚至 Agent Loop）都是插件；ctx.* 是服务定位，ctx.on/waterfall/serial/parallel 是事件。","packages":["@deepseek-ai/cordis"],"files":[{"path":"docs/cordis-primer.zh.md","line":1,"symbol":"Cordis 入门"},{"path":"vendor/cordis/src/index.ts","line":1,"symbol":"Context"}],"why":"没有特权内核意味着任何一层都能被替换：换模型、换工具执行器、换存储都不需要 fork。","status":"源码确认","tags":["框架","核心"]},{"id":"schemastery","name":"Schemastery","layer":"runtime","role":"插件配置 schema 与校验。","usage":"每个插件用 `static Config = z.object({...})` 声明配置；Loader 在挂载时校验并注入默认值。","packages":["@deepseek-ai/schemastery"],"files":[{"path":"vendor/schemastery/src/index.ts","line":1,"symbol":"Schema"}],"why":"配置即契约，profile/patch 的可组合性依赖每个插件自己说清楚接受什么。","status":"源码确认","tags":["框架","配置"]},{"id":"loader","name":"Cordis Loader","layer":"runtime","role":"把 YAML 条目树变成运行中的插件树。","usage":"profile 根 cordis.yml 是空数组，bundle patch 以 insert 方式长出行；Loader 按服务依赖并发挂载、HMR 时重载。","packages":["@deepseek-ai/cordis-plugin-loader"],"files":[{"path":"packages/boot/app-boot/src/index.ts","line":1224,"symbol":"ctx.plugin(Loader)"}],"why":"声明式装配 + 运行时可改，让 profile 成为「产品形态」而不是编译期分支。","status":"源码确认","tags":["启动"]},{"id":"hmr","name":"HMR（配置热重载）","layer":"runtime","role":"监听 profile 配置并在不重启进程的情况下协调重载。","usage":"base 默认开启仅配置监视；Headless / SDK / A Server WebSocket，多路复用所有逻辑流；回执、取消、心跳都在同一 socket 上。","packages":["@deepseek-ai/dsh-api-gateway","@deepseek-ai/dsh-host-webserver"],"files":[{"path":"packages/api/gateway/src/stream-server.ts","line":54,"symbol":"WebSocketServer"}],"why":"Agent 输出是流式的；一条多路复用连接比每个会话一条 socket 更稳。","status":"源码确认","tags":["通信","流"]},{"id":"http","name":"node:http / node:https","layer":"transport","role":"页面与 RPC 的 HTTP 入口。","usage":"webserver 负责路由、gzip、index 注入、WebSocket 升级；同一条连接上先 HTTP 再升级。","packages":["@deepseek-ai/dsh-host-webserver"],"files":[{"path":"packages/host/webserver/src/index.ts","line":1,"symbol":"createServer"}],"why":"不引入框架，减少宿主依赖面，也方便 Desktop 用 file:// + IPC 绕开 HTTP。","status":"源码确认","tags":["通信"]},{"id":"jsonrpc","name":"JSON-RPC（SDK）","layer":"transport","role":"进程间 SDK 协议。","usage":"sdk/server 暴露 prompt 等命令，sdk/client 提供 TypeScript 客户端；Python SDK 通过随附运行时启动 `dsh --profile sdk`。","packages":["@deepseek-ai/dsh-sdk-jsonrpc-server","@deepseek-ai/dsh-sdk-client"],"files":[{"path":"packages/sdk/server/src/server.ts","line":262,"symbol":"prompt()"}],"why":"让别的程序把 dsh 当成一个可嵌入的 Agent 进程，而不是复制一套实现。","status":"源码确认","tags":["通信","SDK"]},{"id":"acp","name":"ACP（Agent Client Protocol）","layer":"transport","role":"面向编辑器的自动化协议。","usage":"acp profile = base + acp-app；acp 包把 prompt / 事件映射到协议会话。","packages":["@deepseek-ai/dsh-acp"],"files":[{"path":"packages/acp/acp/src/index.ts","line":361,"symbol":"prompt()"}],"why":"同一内核可以被不同前端（编辑器、自动化平台）驱动。","status":"源码确认","tags":["通信","入口"]},{"id":"llm-seam","name":"LLM 适配器 seam","layer":"ai","role":"把 provider 的 wire 协议关在适配器里。","usage":"LlmAdapter 只需实现 stream()；ctx.llm 负责注册、路由、prepareCall、重试与 llm/stream 瀑布。","packages":["@deepseek-ai/dsh-llm"],"files":[{"path":"packages/llm/llm/src/index.ts","line":208,"symbol":"LlmAdapter"}],"why":"循环只认识 StreamChunk，不关心是 DeepSeek 还是别家；换模型不动循环。","status":"源码确认","tags":["AI","核心"]},{"id":"deepseek-api","name":"DeepSeek Messages API","layer":"ai","role":"默认 provider。","usage":"DeepSeekAdapter 直连 Messages API，处理鉴权、S
